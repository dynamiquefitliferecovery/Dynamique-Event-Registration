<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamique Sports Rehab Centre</title>
  <style>
    body { background: orange; font-family: 'Segoe UI', sans-serif; margin:0; color:black; }
    header { background:black; color:white; padding:10px; display:flex; gap:10px; }
    header button { background:orange; color:black; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; font-weight:600; }
    header button:hover { background:white; color:black; border:1px solid orange; }
    .container { padding:20px; }
    .card { background:white; padding:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.2); margin-bottom:20px; }
    .section-title { color:black; border-bottom:2px solid orange; margin-bottom:15px; font-size:18px; font-weight:bold; }
    .form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
    .form-actions { margin-top:15px; display:flex; gap:10px; }
    input, select, textarea { width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; }
    button.primary { background:orange; color:black; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; font-weight:600; }
    button.primary:hover { background:black; color:white; }
    button.danger { background:black; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; }
    button.danger:hover { background:orange; color:black; }
    table { width:100%; border-collapse:collapse; margin-top:15px; }
    th, td { border:1px solid #ddd; padding:8px; text-align:left; }
    th { background:black; color:white; }
    .small { font-size:12px; padding:4px 8px; }

/* Center login/logout screen */
#loginTab, #logoutMessage {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh; /* full screen height */
}

.login-card {
  background: white;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  text-align: center;
  max-width: 350px;
  width: 100%;
}

.login-card h2 {
  margin-bottom: 20px;
  color: black;
}

.login-card input, .login-card button {
  width: 100%;
  margin-bottom: 15px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 4px;
}

.login-card button {
  background: orange;
  color: black;
  font-weight: 600;
  cursor: pointer;
}

.login-card button:hover {
  background: black;
  color: white;
}

#loginError {
  margin-top: 10px;
  color: red;
  font-size: 14px;
}

    
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="logoutMessage" hidden>

<div class="container" hidden>

    <button id="tabClients">Clients</button>

  <!-- Clients -->

  <!-- Practitioners -->

  <!-- Appointments -->
  <section id="appointmentsTab" hidden>

    <div class="card">

        <label>Date <input id="a_date" type="date"></label>
        <label>Time <input id="a_time" type="time"></label>
        <label>Client <select id="a_client"></select></label>
        <label>Practitioner <select id="a_practitioner"></select></label>
        <label>Service <select id="a_service"></select></label>
        <label>Payment <select id="a_payment"><option>Cash</option><option>Card</option><option>E-Wallet</option></select></label>

      <div class="form-actions">

        <button id="cancelAppointmentBtn" class="danger">Cancel</button>

      <table>
        <thead>

  <!-- Sales Report -->
  <section id="reportsTab" hidden>

</section>

</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://fmwdizyexroiezezitly.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo"; // replace with your actual key
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= SERVICES ================= */
const SERVICES = [
  { id:"SM", name:"Sports Massage", price:45 },
  { id:"RCB", name:"Recovery Compression Boots", price:25 },
  { id:"AS", name:"Assisted Stretch Session", price:20 },
  { id:"PB", name:"Physio Bundle", price:400 },
  { id:"PKP", name:"Performance Kickstart Program", price:261 },
  { id:"SMFT", name:"Sports Massage - First Trial", price:189 },
  { id:"QF15", name:"Quick Fix 15 minutes", price:15 }
];

/* ================= GLOBAL STATE ================= */
let clients = [];
let practitioners = [];
let appointments = [];

/* ================= HELPERS ================= */
function calcAge(dob) {
  if (!dob) return "";
  const birth = new Date(dob);
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
  return age;
}
function fmtDMY(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}
function formatIC(input) {
  let v = input.value.replace(/\D/g, "");
  if (v.length > 6) v = v.slice(0,6) + "-" + v.slice(6);
  if (v.length > 8) v = v.slice(0,9) + "-" + v.slice(9);
  input.value = v;
}
function formatContact(input) {
  let v = input.value.replace(/\D/g, "");
  if (v.length > 3) v = v.slice(0,3) + "-" + v.slice(3);
  input.value = v;
}

/* ================= CLIENTS ================= */
document.getElementById("c_dob").onchange = () => {
  document.getElementById("c_age").value = calcAge(document.getElementById("c_dob").value);
};

let editingClientId = null;

document.getElementById("addClientBtn").onclick = async () => {
  const client = {
    full_name: document.getElementById("c_name").value,
    date_of_birth: document.getElementById("c_dob").value,
    gender: document.getElementById("c_gender").value,
    citizenship: document.getElementById("c_citizen").value,
    ic_passport: document.getElementById("c_ic").value,
    contact: document.getElementById("c_contact").value,
    email: document.getElementById("c_email").value,
    address: document.getElementById("c_address").value
  };

  if (editingClientId) {
    await sb.from("clients").update(client).eq("id", editingClientId);
    editingClientId = null;
  } else {
    await sb.from("clients").insert(client);
  }

  loadClients();
};

async function loadClients() {
  const { data, error } = await sb
    .from("clients")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Error loading clients:", error);
    return;
  }

  clients = data;

  const table = document.querySelector("#clientsTable");
  table.innerHTML = "";

  const clientSelect = document.getElementById("a_client");
  if (clientSelect) clientSelect.innerHTML = "";

  data.forEach(c => {
    const row = `
      <tr>
        <td>${c.full_name || ""}</td>
        <td>${fmtDMY(c.date_of_birth) || ""}</td>
        <td>${calcAge(c.date_of_birth) || ""}</td>
        <td>${c.gender || ""}</td>
        <td>${c.citizenship || ""}</td>
        <td>${c.ic_passport || ""}</td>
        <td>${c.contact || ""}</td>
        <td>${c.email || ""}</td>
        <td>${c.address || ""}</td>
        <td><button onclick="editClient('${c.id}')" class="small primary">Edit</button></td>
        <td><button onclick="deleteClient('${c.id}')" class="small danger">Delete</button></td>
      </tr>
    `;

    table.insertAdjacentHTML("beforeend", row);

    if (clientSelect) {
      clientSelect.innerHTML += `<option value="${c.id}">${c.full_name}</option>`;
    }
  });
}

async function deleteClient(id) {
  const { error } = await sb.from("clients").delete().eq("id", id);
  if (error) { alert("Error deleting client: " + error.message); return; }
  loadClients();
}

async function editClient(id) {
  const client = clients.find(c => c.id === id);
  if (!client) return;
  document.getElementById("c_name").value = client.full_name;
  document.getElementById("c_dob").value = client.date_of_birth;
  document.getElementById("c_age").value = calcAge(client.date_of_birth);
  document.getElementById("c_gender").value = client.gender;
  document.getElementById("c_citizen").value = client.citizenship;
  document.getElementById("c_ic").value = client.ic_passport;
  document.getElementById("c_contact").value = client.contact;
  document.getElementById("c_email").value = client.email;
  document.getElementById("c_address").value = client.address;

  document.getElementById("addClientBtn").onclick = async () => {
    const updated = {
      full_name: document.getElementById("c_name").value,
      date_of_birth: document.getElementById("c_dob").value,
      gender: document.getElementById("c_gender").value,
      citizenship: document.getElementById("c_citizen").value,
      ic_passport: document.getElementById("c_ic").value,
      contact: document.getElementById("c_contact").value,
      email: document.getElementById("c_email").value,
      address: document.getElementById("c_address").value
    };
    const { error } = await sb.from("clients").update(updated).eq("id", id);
    if (error) { alert("Error updating client: " + error.message); return; }
    loadClients();
    resetClientSave();
  };
}

function resetClientSave() {
  document.getElementById("addClientBtn").onclick = async () => {
    const client = {
      full_name: document.getElementById("c_name").value,
      date_of_birth: document.getElementById("c_dob").value,
      gender: document.getElementById("c_gender").value,
      citizenship: document.getElementById("c_citizen").value,
      ic_passport: document.getElementById("c_ic").value,
      contact: document.getElementById("c_contact").value,
      email: document.getElementById("c_email").value,
      address: document.getElementById("c_address").value
    };
    const { error } = await sb.from("clients").insert(client);
    if (error) { alert("Error saving client: " + error.message); return; }
    loadClients();
    ["c_name","c_dob","c_age","c_gender","c_citizen","c_ic","c_contact","c_email","c_address"]
      .forEach(id => document.getElementById(id).value = "");
  };
}


/* ================= PRACTITIONERS ================= */

async function loadPractitioners() {
  const { data, error } = await sb.from("practitioners").select("*");

  if (error) {
    console.error("Load practitioners error:", error);
    return;
  }

  practitioners = data;

  // TABLE
  const table = document.getElementById("practitionerTable");
  table.innerHTML = "";

  data.forEach(p => {
    table.insertAdjacentHTML("beforeend", `
      <tr>
        <td>${p.name || ""}</td>
        <td>
          <button class="small danger" onclick="deletePractitioner('${p.id}')">
            Delete
          </button>
        </td>
      </tr>
    `);
  });

  // DROPDOWN (appointments)
  const select = document.getElementById("a_practitioner");
  select.innerHTML = `<option value="">Select Practitioner</option>`;

  data.forEach(p => {
    select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
  });
}

/* ADD PRACTITIONER */
document.getElementById("addPractitionerBtn").onclick = async () => {
  const name = document.getElementById("p_name").value.trim();

  if (!name) {
    alert("Enter practitioner name");
    return;
  }

  const { error } = await sb.from("practitioners").insert({ name });

  if (error) {
    alert(error.message);
    return;
  }

  document.getElementById("p_name").value = "";
  loadPractitioners();
};

/* CANCEL */
document.getElementById("cancelPractitionerBtn").onclick = () => {
  document.getElementById("p_name").value = "";
};

/* DELETE */
async function deletePractitioner(id) {
  if (!confirm("Delete this practitioner?")) return;

  const { error } = await sb.from("practitioners").delete().eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  loadPractitioners();
}

/* ================= APPOINTMENTS ================= */

let editingAppointmentId = null;

/* AUTO DATE TIME */
function setCurrentDateTime() {
  const now = new Date();
  document.getElementById("a_date").value = now.toISOString().slice(0,10);
  document.getElementById("a_time").value = now.toTimeString().slice(0,5);
}

/* CALCULATE TOTALS */
function updateTotals() {
  const service = SERVICES.find(s =>
    s.id === document.getElementById("a_service").value
  );

  const amount = service?.price || 0;

  const client = clients.find(c =>
    c.id === document.getElementById("a_client").value
  );

  let sst = 0;

  const needsSST =
    ["SM","PB","PKP"].includes(service?.id) ||
    client?.citizenship === "Foreigner";

  if (needsSST) sst = +(amount * 0.06).toFixed(2);

  const total = amount + sst;

  document.getElementById("a_amount").value = amount.toFixed(2);
  document.getElementById("a_sst").value = sst.toFixed(2);
  document.getElementById("a_total").value = total.toFixed(2);
}

/* TRIGGERS */
document.getElementById("a_service").onchange = updateTotals;
document.getElementById("a_client").onchange = updateTotals;

/* SAVE (INSERT / UPDATE) */
document.getElementById("saveAppointmentBtn").onclick = async () => {

  const service = SERVICES.find(s =>
    s.id === document.getElementById("a_service").value
  );

  const appointment = {
    start_time:
      document.getElementById("a_date").value +
      "T" +
      document.getElementById("a_time").value,

    client_id: document.getElementById("a_client").value,
    practitioner_id: document.getElementById("a_practitioner").value,
    service_id: service?.id,
    payment_method: document.getElementById("a_payment").value,
    remarks: document.getElementById("a_remarks").value,

    amount: parseFloat(document.getElementById("a_amount").value) || 0,
    sst: parseFloat(document.getElementById("a_sst").value) || 0,
    total: parseFloat(document.getElementById("a_total").value) || 0
  };

  let error;

  if (editingAppointmentId) {
    ({ error } = await sb
      .from("appointments")
      .update(appointment)
      .eq("id", editingAppointmentId));

    editingAppointmentId = null;
  } else {
    ({ error } = await sb
      .from("appointments")
      .insert(appointment));
  }

  if (error) {
    alert(error.message);
    return;
  }

  resetAppointmentForm();
  loadAppointments();
};

/* RESET FORM */
function resetAppointmentForm() {
  setCurrentDateTime();

  ["a_client","a_practitioner","a_service","a_payment","a_remarks"]
    .forEach(id => document.getElementById(id).value = "");

  updateTotals();
}

/* LOAD */
async function loadAppointments() {
  const { data, error } = await sb
    .from("appointments")
    .select("*")
    .order("start_time", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  appointments = data;

  const table = document.getElementById("appointmentsTable");
  table.innerHTML = "";

  data.forEach(a => {

    const clientName =
      clients.find(c => c.id === a.client_id)?.full_name || "";

    const practitionerName =
      practitioners.find(p => p.id === a.practitioner_id)?.name || "";

    const serviceName =
      SERVICES.find(s => s.id === a.service_id)?.name || "";

    table.insertAdjacentHTML("beforeend", `
      <tr>
        <td>${a.start_time.slice(0,10)}</td>
        <td>${a.start_time.slice(11,16)}</td>
        <td>${clientName}</td>
        <td>${serviceName}</td>
        <td>${practitionerName}</td>
        <td>${a.payment_method}</td>
        <td>${a.amount?.toFixed(2) || "0.00"}</td>
        <td>${a.sst?.toFixed(2) || "0.00"}</td>
        <td>${a.total?.toFixed(2) || "0.00"}</td>
        <td>${a.remarks || ""}</td>
        <td>
          <button class="small primary" onclick="editAppointment('${a.id}')">
            Edit
          </button>
        </td>
        <td>
          <button class="small danger" onclick="deleteAppointment('${a.id}')">
            Delete
          </button>
        </td>
      </tr>
    `);
  });
}

/* EDIT */
function editAppointment(id) {
  const a = appointments.find(x => x.id === id);
  if (!a) return;

  editingAppointmentId = id;

  document.getElementById("a_date").value = a.start_time.slice(0,10);
  document.getElementById("a_time").value = a.start_time.slice(11,16);
  document.getElementById("a_client").value = a.client_id;
  document.getElementById("a_practitioner").value = a.practitioner_id;
  document.getElementById("a_service").value = a.service_id;
  document.getElementById("a_payment").value = a.payment_method;
  document.getElementById("a_remarks").value = a.remarks;

  updateTotals();
}

/* DELETE */
async function deleteAppointment(id) {
  if (!confirm("Delete this appointment?")) return;

  const { error } = await sb
    .from("appointments")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  loadAppointments();
}

/* ================= SALES REPORT ================= */
let salesChartInstance = null;
let latestReport = {};

async function loadSalesReport() {
  const start = document.getElementById("reportStart").value;
  const end = document.getElementById("reportEnd").value;
  let query = sb.from("appointments").select("*");
  if (start) query = query.gte("start_time", start + "T00:00:00");
  if (end) query = query.lte("start_time", end + "T23:59:59");
  const { data, error } = await query;
  if (error) { console.error(error); return; }

  const report = {};
  data.forEach(a => {
    const serviceName = SERVICES.find(s=>s.id===a.service_id)?.name || "Unknown";
    if (!report[serviceName]) report[serviceName] = { amount:0, sst:0, total:0 };
    report[serviceName].amount += a.amount || 0;
    report[serviceName].sst += a.sst || 0;
    report[serviceName].total += a.total || 0;
  });
  latestReport = report;
 // Update table
  const table = document.getElementById("salesReportTable");
  table.innerHTML = "";
  Object.keys(report).forEach(service => {
    const r = report[service];
    const row = `<tr>
  <td>${service}</td>
  <td>${r.amount.toFixed(2)}</td>
  <td>${r.sst.toFixed(2)}</td>
  <td>${r.total.toFixed(2)}</td>
</tr>`;
    table.insertAdjacentHTML("beforeend", row);
  });

  // Refresh chart
  const ctx = document.getElementById("salesChart").getContext("2d");
  if (salesChartInstance) salesChartInstance.destroy();
  salesChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: Object.keys(report),
      datasets: [{
        label: 'Total Sales',
        data: Object.values(report).map(r=>r.total),
        backgroundColor: 'orange'
      }]
    },
    options: { responsive:true, plugins:{legend:{display:false}} }
  });
}

 document.getElementById("filterReportBtn").onclick = loadSalesReport;
document.getElementById("exportExcelBtn").onclick = () => {
  let csv = "Service,Amount,SST,Total\n";
  Object.keys(latestReport).forEach(s => {
    const r = latestReport[s];
    csv += `${s},${r.amount.toFixed(2)},${r.sst.toFixed(2)},${r.total.toFixed(2)}\n`;
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "sales_report.csv"; a.click();
};



/* ================= LOGIN ================= */
document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById("loginError").innerText = error.message;
    console.error("Login error:", error);
    return;
  }

  if (data.session) {
    document.getElementById("loginTab").hidden = true;
    document.querySelector(".container").hidden = false;
    document.getElementById("logoutMessage").hidden = true;

    loadClients();
    loadPractitioners();
    loadAppointments();
  } else {
    document.getElementById("loginError").innerText = "Login failed: no session created.";
    console.error("No session returned:", data);
  }
};

/* ================= TAB SWITCHING ================= */
function showTab(tabId) {
  ["clientsTab","practitionersTab","appointmentsTab","reportsTab"].forEach(id=>{
    document.getElementById(id).hidden = true;
  });
  document.getElementById(tabId).hidden = false;
  if (tabId === "reportsTab") loadSalesReport();
}
document.getElementById("tabClients").onclick = ()=>showTab("clientsTab");
document.getElementById("tabPractitioners").onclick = ()=>showTab("practitionersTab");
document.getElementById("tabAppointments").onclick = ()=>showTab("appointmentsTab");
document.getElementById("tabReports").onclick = ()=>showTab("reportsTab");

/* ================= INITIALIZATION ================= */
window.onload = async () => {
  const { data: { session }, error } = await sb.auth.getSession();
  if (error) {
    console.error("Session check error:", error);
  }

  if (session) {
    document.getElementById("loginTab").hidden = true;
    document.querySelector(".container").hidden = false;
    document.getElementById("logoutMessage").hidden = true;

    loadClients();
    loadPractitioners();
    loadAppointments();
  } else {
    document.getElementById("loginTab").hidden = false;
    document.querySelector(".container").hidden = true;
    document.getElementById("logoutMessage").hidden = true;
  }

  document.getElementById("loginError").innerText = "";
}
setCurrentDateTime();
updateTotals();



</script>
