<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sports Rehab Management System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f4f6f8}
header{background:#111;color:#fff;padding:10px;display:flex;gap:10px}
header button{background:#ff9800;border:none;padding:8px 14px;border-radius:6px;cursor:pointer}

.container{padding:20px}
.card{background:#fff;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

input,select,textarea{
padding:8px;border-radius:6px;border:1px solid #ddd;width:100%
}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:8px;border:1px solid #eee}
th{background:#fafafa}

button.small{font-size:12px;padding:4px 6px}
canvas{max-height:300px;margin-top:20px}
</style>
</head>

<body>

<header>
<button onclick="show('clients')">Clients</button>
<button onclick="show('pract')">Practitioners</button>
<button onclick="show('appt')">Appointments</button>
<button onclick="show('report')">Reports</button>
</header>

<div class="container">

<!-- CLIENTS -->
<section id="clients" class="card">
<h2>Client Registration</h2>
<div class="grid">
<input id="c_name" placeholder="Full Name">
<select id="c_gender"><option>Male</option><option>Female</option></select>
<input id="c_dob" type="date">
<select id="c_citizen"><option>Malaysian</option><option>Foreigner</option></select>
<input id="c_ic" placeholder="IC / Passport">
<input id="c_contact" placeholder="Contact">
<input id="c_email" placeholder="Email">
<input id="c_address" placeholder="Address">
</div>
<button onclick="saveClient()">Save Client</button>

<h3>Client List</h3>
<table>
<thead>
<tr>
<th>Name</th><th>IC</th><th>Gender</th><th>Age</th>
<th>Contact</th><th>Address</th><th>Email</th><th>Action</th>
</tr>
</thead>
<tbody id="clientTable"></tbody>
</table>
</section>

<!-- PRACTITIONERS -->
<section id="pract" class="card" hidden>
<h2>Practitioners</h2>
<input id="p_name" placeholder="Practitioner Name">
<button onclick="addPractitioner()">Add</button>
<div id="practList"></div>
</section>

<!-- APPOINTMENTS -->
<section id="appt" class="card" hidden>
<h2>Appointment</h2>
<div class="grid">
<input id="a_date" type="date">
<input id="a_time" type="time">
<select id="a_client" onchange="calcTotal()"></select>
<select id="a_prac"></select>
<select id="a_service" onchange="calcTotal()"></select>
<input id="a_amount" readonly placeholder="Amount">
<input id="a_sst" readonly placeholder="SST">
<input id="a_total" readonly placeholder="Total">
</div>
<textarea id="a_remark" placeholder="Remark"></textarea>
<button onclick="saveAppointment()">Save Appointment</button>

<table>
<thead>
<tr>
<th>Date</th><th>Time</th><th>Client</th><th>Service</th>
<th>Amount</th><th>SST</th><th>Total</th>
<th>Practitioner</th><th>Remark</th>
</tr>
</thead>
<tbody id="apptTable"></tbody>
</table>
</section>

<!-- REPORT -->
<section id="report" class="card" hidden>
<h2>Reports</h2>
<input type="date" id="repDate">
<button onclick="generateReport()">Generate</button>
<button onclick="exportExcel()">Export Excel</button>

<p id="repSummary"></p>

<canvas id="serviceChart"></canvas>
<canvas id="ageChart"></canvas>
<canvas id="revenueChart"></canvas>
</section>

</div>

<script>
const sb = supabase.createClient(
   "https://fmwdizyexroiezezitly.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo"
);

let clients=[],services=[],appointments=[];

/* NAV */
function show(id){
document.querySelectorAll("section").forEach(s=>s.hidden=true);
document.getElementById(id).hidden=false;
}

/* CLIENTS */
async function saveClient(){
await sb.from("clients").insert({
full_name:c_name.value,
gender:c_gender.value,
dob:c_dob.value,
citizenship:c_citizen.value,
ic_passport:c_ic.value,
contact:c_contact.value,
email:c_email.value,
address:c_address.value
});
loadClients();
}

async function loadClients(){
let {data}=await sb.from("clients").select("*");
clients=data||[];

clientTable.innerHTML=clients.map(c=>{
let age=new Date().getFullYear()-new Date(c.dob).getFullYear();
return `<tr>
<td>${c.full_name}</td>
<td>${c.ic_passport}</td>
<td>${c.gender}</td>
<td>${age}</td>
<td>${c.contact}</td>
<td>${c.address}</td>
<td>${c.email}</td>
<td><button class="small" onclick="delClient('${c.id}')">Delete</button></td>
</tr>`;
}).join("");

a_client.innerHTML=clients.map(c=>
`<option value="${c.id}" data-cit="${c.citizenship}">${c.full_name}</option>`
).join("");
}

async function delClient(id){
await sb.from("clients").delete().eq("id",id);
loadClients();
}

/* PRACT */
async function addPractitioner(){
await sb.from("practitioners").insert({name:p_name.value});
loadPract();
}
async function loadPract(){
let {data}=await sb.from("practitioners").select("*");
practList.innerHTML=data.map(p=>`${p.name} <button onclick="delPract('${p.id}')">X</button>`).join("<br>");
a_prac.innerHTML=data.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
}
async function delPract(id){
await sb.from("practitioners").delete().eq("id",id);
loadPract();
}

/* SERVICES */
async function loadServices(){
let {data}=await sb.from("services").select("*");
services=data;
a_service.innerHTML=data.map(s=>
`<option value="${s.id}" data-price="${s.price}" data-sst="${s.foreigner_sst}">
${s.name}
</option>`
).join("");
}

/* APPOINTMENT */
function calcTotal(){
let s=a_service.selectedOptions[0];
let c=a_client.selectedOptions[0];
if(!s||!c) return;

let price=Number(s.dataset.price);
let sstApply=(s.dataset.sst==="true" && c.dataset.cit==="Foreigner");
let sst=sstApply?price*0.06:0;

a_amount.value=price.toFixed(2);
a_sst.value=sst.toFixed(2);
a_total.value=(price+sst).toFixed(2);
}

async function saveAppointment(){
await sb.from("appointments").insert({
start_time:`${a_date.value}T${a_time.value}`,
client_id:a_client.value,
practitioner_id:a_prac.value,
service_id:a_service.value,
amount:a_amount.value,
sst:a_sst.value,
total:a_total.value,
remark:a_remark.value
});
loadAppointments();
}

async function loadAppointments(){
let {data}=await sb.from("appointments")
.select(`*,clients(full_name,citizenship,dob),services(name),practitioners(name)`);
appointments=data||[];

apptTable.innerHTML=appointments.map(a=>{
let d=new Date(a.start_time);
return `<tr>
<td>${d.toLocaleDateString()}</td>
<td>${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td>
<td>${a.clients.full_name}</td>
<td>${a.services.name}</td>
<td>${a.amount}</td>
<td>${a.sst}</td>
<td>${a.total}</td>
<td>${a.practitioners.name}</td>
<td>${a.remark||""}</td>
</tr>`;
}).join("");
}

/* REPORT */
function generateReport(){
let total=appointments.reduce((s,a)=>s+Number(a.total),0);
repSummary.innerText=`Total Revenue: RM ${total.toFixed(2)}`;
drawCharts();
}

function drawCharts(){
new Chart(serviceChart,{
type:'pie',
data:{
labels:[...new Set(appointments.map(a=>a.services.name))],
datasets:[{data:appointments.map(a=>a.total),
backgroundColor:['#ff9800','#03a9f4','#4caf50','#e91e63']}]
}});
}

function exportExcel(){
let ws=XLSX.utils.json_to_sheet(appointments);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Report");
XLSX.writeFile(wb,"report.xlsx");
}

/* INIT */
(async()=>{
loadClients();loadPract();loadServices();loadAppointments();
let now=new Date();
a_date.value=now.toISOString().slice(0,10);
a_time.value=now.toTimeString().slice(0,5);
})();
</script>
</body>
</html>
