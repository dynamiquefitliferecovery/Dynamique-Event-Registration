<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sports Rehab System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f4f6f8}

/* LOGIN */
#loginView{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9800,#ffd180);
}

.login-box{
background:#fff;
padding:30px;
border-radius:12px;
width:320px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.login-box input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid #ddd;
}

.login-box button{
width:100%;
padding:10px;
background:orange;
border:none;
border-radius:8px;
cursor:pointer;
}

/* APP */
#appView{display:none}

header{
background:black;
color:white;
padding:10px;
display:flex;
gap:10px;
}

header button{
background:orange;
border:none;
padding:8px 10px;
border-radius:6px;
cursor:pointer;
}

.container{padding:20px}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

input,select{
padding:10px;
border-radius:8px;
border:1px solid #ddd;
width:100%;
}

table{
width:100%;
margin-top:10px;
border-collapse:collapse;
}

td,th{
padding:8px;
border:1px solid #eee;
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginView">
<div class="login-box">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="err"></p>
</div>
</section>

<!-- APP -->
<div id="appView">

<header>
<button onclick="tab('clientsTab')">Clients</button>
<button onclick="tab('pracTab')">Practitioners</button>
<button onclick="tab('appTab')">Appointments</button>
<button onclick="tab('repTab')">Reports</button>
<button onclick="logout()">Logout</button>
</header>

<div class="container">

<!-- CLIENT -->
<section id="clientsTab">
<div class="card">
<h3>Client Registration</h3>

<div class="grid">
<input id="c_name" placeholder="Full Name">

<select id="c_gender">
<option>Male</option>
<option>Female</option>
</select>

<select id="c_citizen">
<option>Malaysian</option>
<option>Foreigner</option>
</select>

<input id="c_ic" placeholder="IC / Passport">
<input id="c_contact" placeholder="Contact">
<input id="c_email" placeholder="Email">
<input id="c_address" placeholder="Address">
</div>

<button onclick="saveClient()">Save</button>
</div>

<div class="card">
<h3>Clients</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>IC / Passport</th>
</tr>
</thead>
<tbody id="clientTable"></tbody>
</table>
</div>
</section>

<!-- PRACT -->
<section id="pracTab" hidden>
<div class="card">
<h3>Practitioners</h3>
<input id="p_name">
<button onclick="addPrac()">Add</button>
<div id="pracList"></div>
</div>
</section>

<!-- APPOINTMENT -->
<section id="appTab" hidden>
<div class="card">
<h3>Appointments</h3>

<div class="grid">
<input id="a_date" type="date">
<input id="a_time" type="time">

<select id="a_client"></select>
<select id="a_prac"></select>
</div>

<button onclick="saveApp()">Save</button>

<table>
<tbody id="appTable"></tbody>
</table>
</div>
</section>

<!-- REPORT -->
<section id="repTab" hidden>
<div class="card">
<h3>Reports</h3>
<p>Report module ready</p>
</div>
</section>

</div>
</div>

<script>

const sb = supabase.createClient(
"https://fmwdizyexroiezezitly.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo"
);

let clients=[],prac=[];

/* LOGIN */
async function login(){
const {data,error}=await sb.auth.signInWithPassword({
email:email.value,
password:password.value
});
if(error) return err.innerText=error.message;

loginView.style.display="none";
appView.style.display="block";

loadClients();
loadPrac();
}

/* TAB FIX */
function tab(t){
clientsTab.hidden=true;
pracTab.hidden=true;
appTab.hidden=true;
repTab.hidden=true;

document.getElementById(t).hidden=false;
}

/* FORMATTERS */
c_ic.oninput = e=>{
let v=e.target.value.replace(/\D/g,"");
if(v.length>6)v=v.slice(0,6)+"-"+v.slice(6);
if(v.length>9)v=v.slice(0,9)+"-"+v.slice(9);
e.target.value=v;
};

c_contact.oninput = e=>{
let v=e.target.value.replace(/\D/g,"");
if(v.length>3)v=v.slice(0,3)+"-"+v.slice(3);
e.target.value=v;
};

/* CLIENT */
async function saveClient(){
await sb.from("clients").insert({
full_name:c_name.value,
gender:c_gender.value,
citizenship:c_citizen.value,
ic_passport:c_ic.value,
contact:c_contact.value,
email:c_email.value,
address:c_address.value
});
loadClients();
}

async function loadClients(){
let {data}=await sb.from("clients").select("*");
clients=data||[];

clientTable.innerHTML=clients.map(c=>
`<tr>
<td>${c.full_name}</td>
<td>${c.ic_passport}</td>
</tr>`
).join("");

a_client.innerHTML=clients.map(c=>
`<option value="${c.id}">${c.full_name}</option>`
).join("");
}

/* PRACT */
async function addPrac(){
await sb.from("practitioners").insert({name:p_name.value});
loadPrac();
}

async function loadPrac(){
let {data}=await sb.from("practitioners").select("*");
prac=data||[];

pracList.innerHTML=prac.map(p=>`<div>${p.name}</div>`).join("");

a_prac.innerHTML=prac.map(p=>
`<option value="${p.id}">${p.name}</option>`
).join("");
}

/* APPOINT */
async function saveApp(){
await sb.from("appointments").insert({
start_time:`${a_date.value}T${a_time.value}`,
client_id:a_client.value,
practitioner_id:a_prac.value
});
}

/* LOGOUT */
function logout(){
location.reload();
}

</script>

</body>
</html>
