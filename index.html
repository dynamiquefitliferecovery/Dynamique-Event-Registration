<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dynamique Sports Rehab Centre</title>

<style>
body { margin:0; font-family:Segoe UI; background:orange; }

header {
  background:black;
  color:white;
  padding:10px;
  display:flex;
  gap:10px;
}

header button {
  background:orange;
  border:none;
  padding:8px 12px;
  font-weight:bold;
  cursor:pointer;
}

.container { padding:20px; }

.card {
  background:white;
  padding:20px;
  border-radius:8px;
  margin-bottom:20px;
}

.section-title {
  font-size:18px;
  font-weight:bold;
  border-bottom:2px solid orange;
}

.form-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

input, select {
  padding:8px;
  width:100%;
}

button.primary { background:orange; }
button.danger { background:black; color:white; }

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td {
  border:1px solid #ddd;
  padding:8px;
}

th { background:black; color:white; }

#loginScreen, #logoutScreen {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.loginBox {
  background:white;
  padding:30px;
  width:300px;
  text-align:center;
  border-radius:8px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="loginError"></p>
  </div>
</div>

<div id="logoutScreen" hidden>
  <div class="loginBox">Logged out</div>
</div>

<!-- APP -->
<div class="container" hidden>

<header>
<button onclick="showTab('clients')">Clients</button>
<button onclick="showTab('practitioners')">Practitioners</button>
<button onclick="showTab('appointments')">Appointments</button>
<button onclick="showTab('reports')">Reports</button>
<button id="logoutBtn">Logout</button>
</header>

<!-- CLIENTS -->
<section id="clients">
<h2 class="section-title">Clients</h2>

<div class="card">
<div class="form-grid">

<input id="c_name" placeholder="Name">
<input id="c_dob" type="date">
<input id="c_age" readonly>
<select id="c_gender">
<option>Male</option><option>Female</option>
</select>
<select id="c_citizen">
<option>Malaysian</option><option>Foreigner</option>
</select>
<input id="c_ic" placeholder="IC">
<input id="c_contact" placeholder="Contact">
<input id="c_email" placeholder="Email">
<input id="c_address" placeholder="Address">

</div>

<button id="saveClient" class="primary">Save</button>
<button onclick="clearClient()" class="danger">Cancel</button>

<table>
<thead>
<tr><th>Name</th><th>Action</th></tr>
</thead>
<tbody id="clientTable"></tbody>
</table>
</div>
</section>

</div>

<script>

/* ================= SUPABASE ================= */
const sb = supabase.createClient(
"https://fmwdizyexroiezezitly.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo"
);

/* ================= STATE ================= */
let clients = [];
let editClientId = null;

/* ================= LOGIN ================= */
loginBtn.onclick = async () => {

const { data, error } = await sb.auth.signInWithPassword({
email: email.value,
password: password.value
});

if (error) return loginError.innerText = error.message;

loginScreen.hidden = true;
document.querySelector(".container").hidden = false;

loadClients();
showTab("clients");
};

/* ================= LOGOUT ================= */
logoutBtn.onclick = async () => {
await sb.auth.signOut();
location.reload();
};

/* ================= TABS ================= */
function showTab(id){
["clients"].forEach(t=>{
document.getElementById(t).hidden = true;
});
document.getElementById(id).hidden = false;
}

/* ================= CLIENT ================= */
function calcAge(dob){
if(!dob) return "";
return new Date().getFullYear() - new Date(dob).getFullYear();
}

c_dob.onchange = () => {
c_age.value = calcAge(c_dob.value);
};

function clearClient(){
editClientId = null;
saveClient.innerText = "Save";

c_name.value="";
c_dob.value="";
c_age.value="";
c_gender.value="Male";
c_citizen.value="Malaysian";
c_ic.value="";
c_contact.value="";
c_email.value="";
c_address.value="";
}

saveClient.onclick = async () => {

const obj = {
full_name:c_name.value,
date_of_birth:c_dob.value,
gender:c_gender.value,
citizenship:c_citizen.value,
ic_passport:c_ic.value,
contact:c_contact.value,
email:c_email.value,
address:c_address.value
};

let error;

if(editClientId){
({error} = await sb.from("clients").update(obj).eq("id",editClientId));
}else{
({error} = await sb.from("clients").insert(obj));
}

if(error) return alert(error.message);

clearClient();
loadClients();
};

async function loadClients(){

const { data } = await sb.from("clients").select("*");

clients = data;

clientTable.innerHTML = "";

data.forEach(c=>{
clientTable.innerHTML += `
<tr>
<td>${c.full_name}</td>
<td>
<button onclick="editClient('${c.id}')">Edit</button>
<button onclick="deleteClient('${c.id}')">Delete</button>
</td>
</tr>`;
});
}

function editClient(id){
const c = clients.find(x=>x.id===id);

editClientId = id;

c_name.value = c.full_name;
c_dob.value = c.date_of_birth;
c_gender.value = c.gender;
c_citizen.value = c.citizenship;
c_ic.value = c.ic_passport;
c_contact.value = c.contact;
c_email.value = c.email;
c_address.value = c.address;

saveClient.innerText = "Update";
}

async function deleteClient(id){
await sb.from("clients").delete().eq("id",id);
loadClients();
}

</script>
</body>
</html>
