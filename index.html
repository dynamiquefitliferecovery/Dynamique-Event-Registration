<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamique Sports Rehab Centre</title>
  <style>
    body { background: orange; font-family: Arial, sans-serif; }
    header { background: black; color: white; padding: 10px; }
    header button { margin-right: 10px; }
    .container { margin: 20px; }
    .card { background: white; padding: 15px; margin-bottom: 20px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-actions { margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 5px; text-align: left; }
    .small { font-size: 12px; padding: 3px 6px; }
    .primary { background: #007bff; color: white; border: none; }
    .danger { background: #dc3545; color: white; border: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container" hidden>
  <header>
    <button id="tabClients">Clients</button>
    <button id="tabPractitioners">Practitioners</button>
    <button id="tabAppointments">Appointments</button>
    <button id="tabReports">Sales Report</button>
    <button id="logoutBtn">Logout</button>
  </header>

  <!-- Clients -->
  <section id="clientsTab" hidden>
    <h2 class="section-title">Client Registration</h2>
    <div class="card">
      <div class="form-grid-2">
        <label>Name <input id="c_name"></label>
        <label>DOB <input id="c_dob" type="date"></label>
        <label>Age <input id="c_age" readonly></label>
        <label>Gender <select id="c_gender"><option>Male</option><option>Female</option></select></label>
        <label>Citizen <select id="c_citizen"><option>Malaysian</option><option>Foreigner</option></select></label>
        <label>IC / Passport <input id="c_ic" oninput="formatIC(this)"></label>
        <label>Contact <input id="c_contact" oninput="formatContact(this)"></label>
        <label>Email <input id="c_email"></label>
        <label>Address <input id="c_address"></label>
      </div>
      <div class="form-actions">
        <button id="addClientBtn" class="primary">Save</button>
        <button class="primary">Cancel</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Name</th><th>DOB</th><th>Age</th><th>Gender</th>
            <th>Citizen</th><th>IC / Passport</th><th>Contact</th>
            <th>Email</th><th>Address</th><th>Edit</th><th>Delete</th>
          </tr>
        </thead>
        <tbody id="clientsTable"></tbody>
      </table>
    </div>
  </section>

  <!-- Practitioners -->
  <section id="practitionersTab" hidden>
    <h2 class="section-title">Practitioners</h2>
    <div class="card">
      <div class="form-grid-2">
        <label>Name <input id="p_name"></label>
      </div>
      <div class="form-actions">
        <button id="addPractitionerBtn" class="primary">Add</button>
        <button class="primary">Cancel</button>
      </div>
      <table>
        <thead>
          <tr><th>Name</th><th>Delete</th></tr>
        </thead>
        <tbody id="practitionerTable"></tbody>
      </table>
    </div>
  </section>

  <!-- Appointments -->
  <section id="appointmentsTab" hidden>
    <h2 class="section-title">Appointments</h2>
    <div class="card">
      <div class="form-grid-2">
        <label>Date <input id="a_date" type="date"></label>
        <label>Time <input id="a_time" type="time"></label>
        <label>Client <select id="a_client"></select></label>
        <label>Practitioner <select id="a_practitioner"></select></label>
        <label>Service <select id="a_service"></select></label>
        <label>Payment <select id="a_payment"><option>Cash</option><option>Card</option><option>E‑Wallet</option></select></label>
        <label>Remarks <input id="a_remarks"></label>
      </div>
      <div class="form-actions">
        <button id="saveAppointmentBtn" class="primary">Save</button>
        <button class="primary">Cancel</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Time</th><th>Client</th><th>Service</th>
            <th>Practitioner</th><th>Payment</th>
            <th>Amount</th><th>SST</th><th>Total</th>
            <th>Remarks</th><th>Edit</th><th>Delete</th>
          </tr>
        </thead>
        <tbody id="appointmentsTable"></tbody>
      </table>
    </div>
  </section>

  <!-- Sales Report -->
  <section id="reportsTab" hidden>
    <h2 class="section-title">Sales Report</h2>
    <div class="card">
      <!-- your report content -->
    </div>
  </section>
</div>

<!-- Login -->
<section id="loginTab">
  <h2>Login</h2>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <div id="loginError"></div>
</section>

<div id="logoutMessage" hidden>Logged out successfully.</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://fmwdizyexroiezezitly.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= SERVICES ================= */
const SERVICES = [
  { id:"SM", name:"Sports Massage", price:45 },
  { id:"RCB", name:"Recovery Compression Boots", price:25 },
  { id:"AS", name:"Assisted Stretch Session", price:20 },
  { id:"PB", name:"Physio Bundle", price:400 },
  { id:"PKP", name:"Performance Kickstart Program", price:261 },
  { id:"SMFT", name:"Sports Massage - First Trial", price:189 },
  { id:"QF15", name:"Quick Fix 15 minutes", price:15 }
];

/* ================= GLOBAL STATE ================= */
let clients = [];
let practitioners = [];
let appointments = [];

/* ================= HELPERS ================= */
function calcAge(dob) {
  if (!dob) return "";
  const birth = new Date(dob);
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
  return age;
}
function fmtDMY(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}
function formatIC(input) {
  let v = input.value.replace(/\D/g, "");
  if (v.length > 6) v = v.slice(0,6) + "-" + v.slice(6);
  if (v.length > 8) v = v.slice(0,9) + "-" + v.slice(9);
  input.value = v;
}
function formatContact(input) {
  let v = input.value.replace(/\D/g, "");
  if (v.length > 3) v = v.slice(0,3) + "-" + v.slice(3);
  input.value = v;
}

/* ================= CLIENTS ================= */
document.getElementById("c_dob").onchange = () => {
  document.getElementById("c_age").value = calcAge(document.getElementById("c_dob").value);
};

document.getElementById("addClientBtn").onclick = async () => {
  const client = {
    full_name: document.getElementById("c_name").value,
    date_of_birth: document.getElementById("c_dob").value,
    gender: document.getElementById("c_gender").value,
    citizenship: document.getElementById("c_citizen").value,
    ic_passport: document.getElementById("c_ic").value,
    contact: document.getElementById("c_contact").value,
    email: document.getElementById("c_email").value,
    address: document.getElementById("c_address").value
  };
  const { error } = await sb.from("clients").insert(client);
  if (error) { alert("Error saving client: " + error.message); return; }
  loadClients();
  ["c_name","c_dob","c_age","c_gender","c_citizen","c_ic","c_contact","c_email","c_address"]
    .forEach(id => document.getElementById(id).value = "");
};

async function loadClients() {
  const { data, error } = await sb.from("clients").select("*").order("created_at",{ascending:false});
  if (error) { console.error("Error loading clients:", error); return; }
  clients = data;
  const table = document.querySelector("#clientsTable");
  table.innerHTML = "";
  data.forEach(c => {
    const row = `<tr>
      <td>${c.full_name||""}</td>
      <td>${fmtDMY(c.date_of_birth)||""}</td>
      <td>${calcAge(c.date_of_birth)||""}</td>
      <td>${c.gender||""}</td>
      <td>${c.citizenship||""}</td>
      <td>${c.ic_passport||""}</td>
      <td>${c.contact||""}</td>
      <td>${c.email||""}</td>
      <td>${c.address||""}</td>
      <td><button onclick="editClient('${c.id}')" class="small primary">Edit</button></td>
      <td><button onclick="deleteClient('${c.id}')" class="small danger">Delete</button></td>
    </tr>`;
    table.insertAdjacentHTML("beforeend", row);
  });
  const clientSelect = document.getElementById("a_client");
  if (clientSelect) {
    clientSelect.innerHTML = "<option value=''>Select Client</option>";
    data.forEach(c => { clientSelect.innerHTML += `<option value="${c.id}">${c.full_name}</option>`; });
  }
}

/* ================= PRACTITIONERS ================= */
document.getElementById("addPractitionerBtn").onclick = async () => {
  const name = document.getElementById("p_name").value;
  if (!name) return;
  const { error } = await sb.from("practitioners").insert({ name });
  if (error) { alert("Error saving practitioner: " + error.message); return; }
  loadPractitioners();
  document.getElementById("p_name").value = "";
};

async function deletePractitioner(id) {
  const { error } = await sb.from("practitioners").delete().eq("id", id);
  if (error) { alert("Error deleting practitioner: " + error.message); return; }
  loadPractitioners();
}

async function loadPractitioners() {
  const { data, error } = await sb.from("practitioners").select("*").order("created_at",{ascending:false});
  if (error) { console.error("Error loading practitioners:", error); return; }
  practitioners = data;
  const table = document.querySelector("#practitionerTable");
  table.innerHTML = "";
  data.forEach(p => {
    const row = `<tr>
      <td>${p.name||""}</td>
      <td><button onclick="deletePractitioner('${p.id}')" class="small danger">Delete</button></td>
    </tr>`;
    table.insertAdjacentHTML("beforeend", row);
  });
  const pracSelect = document.getElementById("a_practitioner");
  if (pracSelect) {
    pracSelect.innerHTML = "<option value=''>Select Practitioner</option>";
    data.forEach(p => { pracSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
  }
}

/* ================= APPOINTMENTS ================= */
document.getElementById("saveAppointmentBtn").onclick = async () => {
  const service = SERVICES.find(s => s.id === document.getElementById("a_service").value);
  const amount = service?.price || 0;
  const sst = +(amount*0.06).toFixed(2);
  const total = amount+sst;
  const appointment = {
    start_time: document.getElementById("a_date").value+"T"+document.getElementById("a_time").value,
    client_id: document.getElementById("a_client").value,
    practitioner_id: document.getElementById("a_practitioner").value,
    service_id: service?.id,
    payment_method: document.getElementById("a_payment").value,
    remarks: document.getElementById("a_remarks").value,
    amount, sst, total
  };
  const { error } = await sb.from("appointments").insert(appointment);
  if (error) { alert("Error saving appointment: " + error.message); return; }
  loadAppointments();
  ["a_date","a_time","a_client","a_practitioner","a_service","a_payment","a_remarks"]
    .forEach(id => document.getElementById(id).value = "");
};

async function loadAppointments() {
  const { data, error } = await sb.from("appointments").select("*").order("start_time",{ascending:false});
  if (error) { console.error("Error loading appointments:", error); return; }
  appointments = data;
  const table = document.querySelector("#appointmentsTable");
  table.innerHTML = "";
  data.forEach(a => {
    const clientName = clients.find(c=>c.id===a.client_id)?.full_name||"";
    const practitionerName = practitioners.find(p=>p.id===a.practitioner_id)?.name||"";
    const serviceName = SERVICES.find(s=>s.id===a.service_id)?.name||"";
    const row = `<tr>
      <td>${a.start_time.slice(0,10)}</td>
      <td>${a.start_time.slice(11,16)}</td>
      <td>${clientName}</td>
      <td>${serviceName}</td>
      <td>${practitionerName}</td>
      <td>${a.payment_method}</td>
      <td>${a.amount?.toFixed(2)||"0.00"}</td>
      <td>${a.sst?.toFixed(2)||"0.00"}</td>
      <td>${a.total?.toFixed(2)||"0.00"}</td>
      <td>${a.remarks||""}</td>
      <td><button onclick="editAppointment('${a.id}')" class="small primary">Edit</button></td>
      <td><button onclick="deleteAppointment('${a.id}')" class="small danger">Delete</button></td>
    </tr>`;
    table.insertAdjacentHTML("beforeend", row);
  });
}

async function deleteAppointment(id) {
  const { error } = await sb.from("appointments").delete().eq("id", id);
  if (error) { alert("Error deleting appointment: " + error.message); return; }
  loadAppointments();
}

/* ================= LOGIN/LOGOUT ================= */
document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById("loginError").textContent = "Login failed: " + error.message;
    return;
  }
  document.getElementById("loginTab").hidden = true;
  document.querySelector(".container").hidden = false;
  loadClients(); loadPractitioners(); loadAppointments();
};

document.getElementById("logoutBtn").onclick = async () => {
  await sb.auth.signOut();
  document.querySelector(".container").hidden = true;
  document.getElementById("loginTab").hidden = false;
  document.getElementById("logoutMessage").hidden = false;
};

/* ================= TAB SWITCHING ================= */
function showTab(tabId) {
  ["clientsTab","practitionersTab","appointmentsTab","reportsTab"].forEach(id=>{
    document.getElementById(id).hidden = true;
  });
  document.getElementById(tabId).hidden = false;
}
document.getElementById("tabClients").onclick = ()=>showTab("clientsTab");
document.getElementById("tabPractitioners").onclick = ()=>showTab("practitionersTab");
document.getElementById("tabAppointments").onclick = ()=>showTab("appointmentsTab");
document.getElementById("tabReports").onclick = ()=>showTab("reportsTab");

/* ================= INITIALIZATION ================= */
window.onload = async () => {
  // Populate service dropdown
  const serviceSelect = document.getElementById("a_service");
  if (serviceSelect) {
    serviceSelect.innerHTML = "<option value=''>Select Service</option>";
    SERVICES.forEach(s => {
      serviceSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
    });
  }

  // Default view: login visible, dashboard hidden
  document.getElementById("loginTab").hidden = false;
  document.querySelector(".container").hidden = true;
};

/* ================= CLIENT EDIT/DELETE ================= */
async function deleteClient(id) {
  const { error } = await sb.from("clients").delete().eq("id", id);
  if (error) { alert("Error deleting client: " + error.message); return; }
  loadClients();
}

async function editClient(id) {
  const client = clients.find(c => c.id === id);
  if (!client) return;
  // Populate form with existing values
  document.getElementById("c_name").value = client.full_name;
  document.getElementById("c_dob").value = client.date_of_birth;
  document.getElementById("c_age").value = calcAge(client.date_of_birth);
  document.getElementById("c_gender").value = client.gender;
  document.getElementById("c_citizen").value = client.citizenship;
  document.getElementById("c_ic").value = client.ic_passport;
  document.getElementById("c_contact").value = client.contact;
  document.getElementById("c_email").value = client.email;
  document.getElementById("c_address").value = client.address;

  // Override Save button to update instead of insert
  document.getElementById("addClientBtn").onclick = async () => {
    const updated = {
      full_name: document.getElementById("c_name").value,
      date_of_birth: document.getElementById("c_dob").value,
      gender: document.getElementById("c_gender").value,
      citizenship: document.getElementById("c_citizen").value,
      ic_passport: document.getElementById("c_ic").value,
      contact: document.getElementById("c_contact").value,
      email: document.getElementById("c_email").value,
      address: document.getElementById("c_address").value
    };
    const { error } = await sb.from("clients").update(updated).eq("id", id);
    if (error) { alert("Error updating client: " + error.message); return; }
    loadClients();
    // Reset Save button back to insert mode
    resetClientSave();
  };
}

function resetClientSave() {
  document.getElementById("addClientBtn").onclick = async () => {
    const client = {
      full_name: document.getElementById("c_name").value,
      date_of_birth: document.getElementById("c_dob").value,
      gender: document.getElementById("c_gender").value,
      citizenship: document.getElementById("c_citizen").value,
      ic_passport: document.getElementById("c_ic").value,
      contact: document.getElementById("c_contact").value,
      email: document.getElementById("c_email").value,
      address: document.getElementById("c_address").value
    };
    const { error } = await sb.from("clients").insert(client);
    if (error) { alert("Error saving client: " + error.message); return; }
    loadClients();
    ["c_name","c_dob","c_age","c_gender","c_citizen","c_ic","c_contact","c_email","c_address"]
      .forEach(id => document.getElementById(id).value = "");
  };
}

/* ================= APPOINTMENT EDIT/DELETE ================= */
async function deleteAppointment(id) {
  const { error } = await sb.from("appointments").delete().eq("id", id);
  if (error) { alert("Error deleting appointment: " + error.message); return; }
  loadAppointments();
}

async function editAppointment(id) {
  const a = appointments.find(appt => appt.id === id);
  if (!a) return;
  // Populate form
  document.getElementById("a_date").value = a.start_time.slice(0,10);
  document.getElementById("a_time").value = a.start_time.slice(11,16);
  document.getElementById("a_client").value = a.client_id;
  document.getElementById("a_practitioner").value = a.practitioner_id;
  document.getElementById("a_service").value = a.service_id;
  document.getElementById("a_payment").value = a.payment_method;
  document.getElementById("a_remarks").value = a.remarks;

  // Override Save button to update instead of insert
  document.getElementById("saveAppointmentBtn").onclick = async () => {
    const service = SERVICES.find(s => s.id === document.getElementById("a_service").value);
    const amount = service?.price || 0;
    const sst = +(amount*0.06).toFixed(2);
    const total = amount+sst;
    const updated = {
      start_time: document.getElementById("a_date").value+"T"+document.getElementById("a_time").value,
      client_id: document.getElementById("a_client").value,
      practitioner_id: document.getElementById("a_practitioner").value,
      service_id: service?.id,
      payment_method: document.getElementById("a_payment").value,
      remarks: document.getElementById("a_remarks").value,
      amount, sst, total
    };
    const { error } = await sb.from("appointments").update(updated).eq("id", id);
    if (error) { alert("Error updating appointment: " + error.message); return; }
    loadAppointments();
    resetAppointmentSave();
  };
}

function resetAppointmentSave() {
  document.getElementById("saveAppointmentBtn").onclick = async () => {
    const service = SERVICES.find(s => s.id === document.getElementById("a_service").value);
    const amount = service?.price || 0;
    const sst = +(amount*0.06).toFixed(2);
    const total = amount+sst;
    const appointment = {
      start_time: document.getElementById("a_date").value+"T"+document.getElementById("a_time").value,
      client_id: document.getElementById("a_client").value,
      practitioner_id: document.getElementById("a_practitioner").value,
      service_id: service?.id,
      payment_method: document.getElementById("a_payment").value,
      remarks: document.getElementById("a_remarks").value,
      amount, sst, total
    };
    const { error } = await sb.from("appointments").insert(appointment);
    if (error) { alert("Error saving appointment: " + error.message); return; }
    loadAppointments();
    ["a_date","a_time","a_client","a_practitioner","a_service","a_payment","a_remarks"]
      .forEach(id => document.getElementById(id).value = "");
  };
}
</script>
</body>
</html>
