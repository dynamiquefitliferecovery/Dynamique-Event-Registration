<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dynamique Sports Rehab Centre</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { background: orange; font-family: Segoe UI; margin:0; }
.container { padding:20px; }
.card { background:white; padding:20px; margin-bottom:20px; border-radius:8px; }
header { background:black; color:white; padding:10px; display:flex; gap:10px; }
header button { background:orange; border:none; padding:8px; cursor:pointer; }

input, select { width:100%; padding:8px; margin:5px 0; }
table { width:100%; border-collapse:collapse; }
th, td { border:1px solid #ddd; padding:6px; }
th { background:black; color:white; }
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginTab">
  <div class="card">
    <h2>Login</h2>
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="loginError"></div>
  </div>
</section>

<div class="container" hidden>

<header>
  <button onclick="showTab('clientsTab')">Clients</button>
  <button onclick="showTab('practitionersTab')">Practitioners</button>
  <button onclick="showTab('appointmentsTab')">Appointments</button>
  <button onclick="showTab('reportsTab')">Reports</button>
  <button id="logoutBtn">Logout</button>
</header>

<!-- CLIENTS -->
<section id="clientsTab">
<div class="card">
<h2>Clients</h2>

<input id="c_name" placeholder="Name">
<input id="c_dob" type="date">
<input id="c_age" readonly>
<select id="c_gender"><option>Male</option><option>Female</option></select>
<select id="c_citizen"><option>Malaysian</option><option>Foreigner</option></select>
<input id="c_ic" placeholder="IC">
<input id="c_contact" placeholder="Contact">
<input id="c_email" placeholder="Email">
<input id="c_address" placeholder="Address">

<button id="saveClientBtn">Save</button>

<table>
<thead>
<tr><th>Name</th><th>Action</th></tr>
</thead>
<tbody id="clientsTable"></tbody>
</table>
</div>
</section>

<!-- PRACTITIONERS -->
<section id="practitionersTab" hidden>
<div class="card">
<h2>Practitioners</h2>
<input id="p_name">
<button id="addPractitionerBtn">Add</button>

<table>
<tbody id="practitionerTable"></tbody>
</table>
</div>
</section>

<!-- APPOINTMENTS -->
<section id="appointmentsTab" hidden>
<div class="card">
<h2>Appointments</h2>

<input id="a_date" type="date">
<input id="a_time" type="time">
<select id="a_client"></select>
<select id="a_practitioner"></select>
<select id="a_service"></select>
<select id="a_payment">
<option>Cash</option><option>Card</option>
</select>

<input id="a_amount" readonly>
<input id="a_sst" readonly>
<input id="a_total" readonly>

<button id="saveAppointmentBtn">Save</button>

<table>
<tbody id="appointmentsTable"></tbody>
</table>
</div>
</section>

<!-- REPORT -->
<section id="reportsTab" hidden>
<div class="card">
<h2>Sales Report</h2>
<canvas id="salesChart"></canvas>
</div>
</section>

</div>

<script>

/* ================= SAFE GLOBALS ================= */
const sb = supabase.createClient(
"https://fmwdizyexroiezezitly.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo"
);

let clients = [];
let practitioners = [];
let appointments = [];

let editingClientId = null;
let editingAppointmentId = null;

/* ================= SERVICES ================= */
const SERVICES = [
{ id:"SM", name:"Massage", price:45 },
{ id:"AS", name:"Stretch", price:20 }
];

/* ================= TAB ================= */
function showTab(id){
document.querySelectorAll("section").forEach(s=>s.hidden=true);
document.getElementById(id).hidden=false;
}

/* ================= LOGIN ================= */
document.getElementById("loginBtn").onclick = async () => {
const email = loginEmail.value;
const password = loginPassword.value;

const { data, error } = await sb.auth.signInWithPassword({
email, password
});

if(error){
loginError.innerText = error.message;
return;
}

document.getElementById("loginTab").hidden = true;
document.querySelector(".container").hidden = false;

loadClients();
loadPractitioners();
loadAppointments();
showTab("clientsTab");
};

/* ================= LOGOUT ================= */
document.getElementById("logoutBtn").onclick = async () => {
await sb.auth.signOut();
location.reload();
};

/* ================= CLIENTS ================= */
document.getElementById("saveClientBtn").onclick = async () => {

const client = {
full_name: c_name.value,
date_of_birth: c_dob.value,
gender: c_gender.value,
citizenship: c_citizen.value,
ic_passport: c_ic.value,
contact: c_contact.value,
email: c_email.value,
address: c_address.value
};

if(editingClientId){
await sb.from("clients").update(client).eq("id",editingClientId);
editingClientId=null;
}else{
await sb.from("clients").insert(client);
}

loadClients();
};

async function loadClients(){
const { data } = await sb.from("clients").select("*");
clients = data || [];

clientsTable.innerHTML="";
a_client.innerHTML="";

clients.forEach(c=>{
clientsTable.innerHTML+=`
<tr>
<td>${c.full_name}</td>
<td><button onclick="editClient('${c.id}')">Edit</button></td>
</tr>`;

a_client.innerHTML+=`<option value="${c.id}">${c.full_name}</option>`;
});
}

window.editClient = (id)=>{
const c = clients.find(x=>x.id===id);
editingClientId = id;

c_name.value=c.full_name;
c_dob.value=c.date_of_birth;
c_gender.value=c.gender;
c_citizen.value=c.citizenship;
c_ic.value=c.ic_passport;
c_contact.value=c.contact;
c_email.value=c.email;
c_address.value=c.address;
};

/* ================= PRACTITIONERS ================= */
document.getElementById("addPractitionerBtn").onclick = async () => {
await sb.from("practitioners").insert({ name:p_name.value });
loadPractitioners();
};

async function loadPractitioners(){
const { data } = await sb.from("practitioners").select("*");
practitioners = data || [];

practitionerTable.innerHTML="";
a_practitioner.innerHTML="";

practitioners.forEach(p=>{
practitionerTable.innerHTML+=`
<tr><td>${p.name}</td></tr>`;

a_practitioner.innerHTML+=`
<option value="${p.id}">${p.name}</option>`;
});
}

/* ================= APPOINTMENTS ================= */
document.getElementById("saveAppointmentBtn").onclick = async () => {

const service = SERVICES[0];

const a = {
start_time: a_date.value+"T"+a_time.value,
client_id: a_client.value,
practitioner_id: a_practitioner.value,
amount: service.price,
sst: service.price*0.06,
total: service.price*1.06
};

await sb.from("appointments").insert(a);
loadAppointments();
};

async function loadAppointments(){
const { data } = await sb.from("appointments").select("*");
appointments = data || [];

appointmentsTable.innerHTML="";

appointments.forEach(a=>{
appointmentsTable.innerHTML+=`
<tr>
<td>${a.start_time}</td>
<td>${a.total}</td>
</tr>`;
});
}

/* ================= INIT ================= */
window.onload = async () => {
const { data } = await sb.auth.getSession();

if(data.session){
document.querySelector(".container").hidden=false;
loadClients();
loadPractitioners();
loadAppointments();
}
};

</script>
</body>
</html>
