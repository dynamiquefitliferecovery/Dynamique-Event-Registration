/* ================= FORMATTERS ================= */

function formatIc(v = "") {
  return v
    ? v.replace(/(\d{6})(\d{2})(\d{4})/, "$1-$2-$3")
    : "";
}

function formatContact(v = "") {
  return v
    ? v.replace(/(\d{3})(\d{7,8})/, "$1-$2")
    : "";
}


/* ================= HELPER FUNCTION ================= */

  function calculateAge(dob) {
  if (!dob) return "";
  const birth = new Date(dob);
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
    age--;
  }
  return age;
}

  function toMYTime(dateString) {
  const d = new Date(dateString);
  return new Date(d.getTime() + 8 * 60 * 60 * 1000);
}

/* ===== LOAD CLIENTS ===== */
async function loadClients() {
  // ✅ Confirm auth state
  const { data: { user } } = await sb.auth.getUser();
  console.log("Admin user:", user);

  if (!user) {
    console.warn("Not authenticated — cannot load clients");
    return;
  }

  // ✅ Load clients
  const { data, error } = await sb
    .from("clients")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("loadClients error:", error);
    return;
  }

  clients = data || [];
  clientsTable.innerHTML = "";

  clients.forEach(c => {
    const tr = document.createElement("tr");

    tr.innerHTML =
      `<td>${c.full_name}</td>
       <td>${c.date_of_birth}</td>
       <td>${calculateAge(c.date_of_birth)}</td>
       <td>${c.gender}</td>
       <td>${c.citizenship}</td>
       <td>${formatIc(c.ic_passport || "")}</td>
       <td>${formatContact(c.contact || "")}</td>
       <td>${c.email || ""}</td>`;

    const actionTd = document.createElement("td");

    const edit = document.createElement("span");
    edit.textContent = "Edit";
    edit.className = "edit";
    edit.onclick = () => editClient(c.id);

    const del = document.createElement("span");
    del.textContent = "Delete";
    del.className = "edit";
    del.style.marginLeft = "8px";
    del.onclick = () => deleteClient(c.id);

    actionTd.append(edit, document.createTextNode(" | "), del);
    tr.appendChild(actionTd);

    clientsTable.appendChild(tr);
  });
}


/* ===== EDIT CLIENT ===== */
function editClient(id) {
  const c = clients.find(x => x.id == id);
  if (!c) return;

  editingClientId = id;

  clientName.value = c.full_name || "";
  clientDob.value = c.date_of_birth || "";
  clientGender.value = c.gender || "Male";
  clientCitizenship.value = c.citizenship || "Malaysian";
  clientIc.value = c.ic_passport || "";
  clientContact.value = c.contact || "";
  clientEmail.value = c.email || "";
  clientAddress.value = c.address || "";
}

/* ===== DELETE CLIENT ===== */
async function deleteClient(id) {
  if (!confirm("Delete this client?")) return;

  const { error } = await sb
    .from("clients")
    .delete()
    .eq("id", id);

  if (error) {
    console.error(error);
    alert("Failed to delete client");
    return;
  }

  loadClients();
}

/* ===== SAVE CLIENT (INSERT + UPDATE) ===== */
saveClientBtn.addEventListener("click", saveClient);

async function saveClient() {
  if (!clientName.value || !clientDob.value) {
    alert("Name and DOB are required");
    return;
  }

  const payload = {
    full_name: clientName.value.trim(),
    date_of_birth: clientDob.value,
    gender: clientGender.value,
    citizenship: clientCitizenship.value,
    ic_passport: clientIc.value.trim(),
    contact: clientContact.value.trim(),
    email: clientEmail.value.trim(),
    address: clientAddress.value.trim()
  };

  let error;

  if (editingClientId) {
    ({ error } = await sb
      .from("clients")
      .update(payload)
      .eq("id", editingClientId));
  } else {
    ({ error } = await sb
      .from("clients")
      .insert(payload));
  }

  if (error) {
    console.error(error);
    alert("Failed to save client");
    return;
  }

  editingClientId = null;
  clearClientForm();
  loadClients();
}

function exportClients() {
  if (!clients.length) {
    alert("No clients to export");
    return;
  }

  const sortedClients = [...clients].sort((a, b) =>
    (a.full_name || "").localeCompare(b.full_name || "")
  );

  let html = `
  <table border="1">
    <tr style="font-weight:bold;">
      <th style="width:180px;">Name</th>
      <th style="width:120px;">DOB (DD-MM-YYYY)</th>
      <th style="width:60px;">Age</th>

      <th style="width:160px;">IC</th>
      <th style="width:140px;">Contact</th>
      <th style="width:200px;">Email</th>
      <th style="width:250px;">Address</th>
    </tr>
  `;

  sortedClients.forEach(c => {
    const dob = c.date_of_birth
      ? new Date(c.date_of_birth).toLocaleDateString("en-GB") // DD/MM/YYYY
      : "";

    html += `
      <tr>
        <td>${c.full_name || ""}</td>
        <td>${dob}</td>
        <td>${calculateAge(c.date_of_birth)}</td>
        <td>${c.gender || ""}</td>
        <td>${c.citizenship || ""}</td>
        <td style="mso-number-format:'\\@'">${c.ic_passport || ""}</td>
        <td style="mso-number-format:'\\@'">${c.contact || ""}</td>
        <td>${c.email || ""}</td>
        <td>${c.address || ""}</td>
      </tr>
    `;
  });

  html += "</table>";

  const blob = new Blob([html], { type: "application/vnd.ms-excel" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "clients.xls";
  a.click();
}

// ✅ Age
tr.appendChild(td(calculateAge(a.client?.date_of_birth)));


    // ✅ Service (NO r ANYWHERE)
    tr.appendChild(td(a.service?.name || ""));

    // Charges
    tr.appendChild(td(Number(a.amount).toFixed(2)));
    tr.appendChild(td(Number(a.sst).toFixed(2)));
    tr.appendChild(td(Number(a.total).toFixed(2)));

    // Payment
    tr.appendChild(td(a.payment_method || ""));

    // Actions
    const actionTd = document.createElement("td");

    const edit = document.createElement("span");
    edit.textContent = "Edit";
    edit.className = "edit";
    edit.onclick = () => editAppointment(a.id);

    const del = document.createElement("span");
    del.textContent = "Delete";
    del.className = "edit";
    del.style.marginLeft = "8px";
    del.onclick = () => deleteAppointment(a.id);

    actionTd.append(edit, document.createTextNode(" | "), del);
    tr.appendChild(actionTd);

    // Remarks
    tr.appendChild(td(a.remarks || ""));

    apptTable.appendChild(tr);
  });
}

 async function editAppointment(id) {
  const { data, error } = await sb
    .from("appointments")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !data) {
    alert("Failed to load appointment");
    return;
  }

  editingAppointmentId = id;

const start = toMYTime(data.start_time);

apptDate.value = start.toLocaleDateString("en-CA"); // YYYY-MM-DD
apptTime.value = start.toLocaleTimeString("en-GB", {
  hour: "2-digit",
  minute: "2-digit",
  hour12: false
});

  apptClient.value = data.client_id;
  apptPractitioner.value = data.practitioner_id;
  apptService.value = data.service_id;
  apptPayment.value = data.payment_method;
  apptRemarks.value = data.remarks || "";

  apptAmount.value = Number(data.amount).toFixed(2);
  apptSST.value = Number(data.sst).toFixed(2);
  apptTotal.value = Number(data.total).toFixed(2);

  document.querySelector("#appointmentsTab .action").innerText = "Update Appointment";
}

async function saveAppointment() {
  if (
    !apptDate.value ||
    !apptTime.value ||
    !apptClient.value ||
    !apptPractitioner.value ||
    !apptPayment.value
  ) {
    alert("Please complete all required fields");
    return;
  }

  const startTime = new Date(`${apptDate.value}T${apptTime.value}:00`);
  const endTime = new Date(startTime);
  endTime.setHours(endTime.getHours() + 1);

const payload = {
  start_time: startTime.toISOString(),
  end_time: endTime.toISOString(),
  client_id: apptClient.value,              // ✅ UUID (string)
  practitioner_id: apptPractitioner.value,  // ✅ UUID
  service_id: apptService.value,             // ✅ UUID
  payment_method: apptPayment.value,
  remarks: apptRemarks.value.trim(),
  amount: Number(apptAmount.value),
  sst: Number(apptSST.value),
  total: Number(apptTotal.value)
};

  let error;

  if (editingAppointmentId) {
    ({ error } = await sb
      .from("appointments")
      .update(payload)
      .eq("id", editingAppointmentId));
  } else {
    ({ error } = await sb
      .from("appointments")
      .insert(payload));
  }

  if (error) {
    console.error("saveAppointment error:", error);
    alert("Failed to save appointment");
    return;
  }

  clearAppointmentForm();
  editingAppointmentId = null;
  document.querySelector("#appointmentsTab .action").innerText = "Save Appointment";
  loadAppointments();
}
  

async function deleteAppointment(id) {
  if (!confirm("Delete this appointment?")) return;

  const { error } = await sb
    .from("appointments")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Failed to delete appointment");
    return;
  }

  loadAppointments();
}

  function updateSelectedClientAge() {
  const c = clients.find(x => x.id == apptClient.value);

  apptAge.value = c
    ? calculateAge(c.date_of_birth)
    : "";
}

/* ================= REPORT ================= */
async function loadReport() {
  const from = reportFrom.value;
  const to = reportTo.value;

  reportData = [];
  let totalAmount = 0;

  let query = sb
    .from("appointments")
    .select(`
      start_time,
      amount,
      sst,
      total,
      payment_method,
      remarks,
      service:services(name),
      client:clients(full_name, citizenship, date_of_birth, gender, contact)
    `)
    .order("start_time", { ascending: true });

  if (from) query = query.gte("start_time", from);
  if (to) query = query.lte("start_time", to + "T23:59:59");

  const { data, error } = await query;

  if (error) {
    console.error(error);
    alert("Failed to load sales report");
    return;
  }

  const tbody = document.getElementById("reportTable");
  tbody.innerHTML = "";

  data.forEach(r => {
    const tr = document.createElement("tr");
    const td = v => {
      const c = document.createElement("td");
      c.textContent = v;
      return c;
    };

    const d = toMYTime(r.start_time);

    tr.appendChild(td(d.toLocaleDateString("en-MY")));
    tr.appendChild(td(r.client?.full_name || ""));
    tr.appendChild(td(calculateAge(r.client?.date_of_birth)));
    tr.appendChild(td(r.client?.citizenship || ""));
    tr.appendChild(td(r.service?.name || ""));
    tr.appendChild(td(Number(r.amount).toFixed(2)));
    tr.appendChild(td(Number(r.sst).toFixed(2)));
    tr.appendChild(td(Number(r.total).toFixed(2)));
    tr.appendChild(td(r.payment_method || ""));
    tr.appendChild(td(r.remarks || ""));

    tbody.appendChild(tr);

    totalAmount += Number(r.total || 0);

    reportData.push({
      date: d.toLocaleDateString("en-MY"),
      client: r.client?.full_name || "",
      age: calculateAge(r.client?.date_of_birth),
      citizenship: r.client?.citizenship || "", 
      gender: r.client?.gender || "",
      contact: r.client?.contact || "",
      service: r.service?.name || "",
      amount: Number(r.amount),
      sst: Number(r.sst),
      total: Number(r.total),
      payment: r.payment_method || "",
      remarks: r.remarks || ""
    });
  });

  document.querySelector("#reportsTab .total").innerText =
    "Total: RM " + totalAmount.toFixed(2);
}

function exportReportExcel() {
  if (!reportData.length) return alert("No data to export");

  const rows = [
   "Date,Client,Age,Citizenship,Gender,Contact,Service,Amount,SST,Total,Payment,Remarks"

  ];

  reportData.forEach(r => {
rows.push([
  r.date,
  `"${r.client}"`,
  r.age,
  r.citizenship,
  r.gender,
  `"${r.contact}"`, // ✅ keep as text (0 safe)
  `"${r.service}"`,
  r.amount.toFixed(2),
  r.sst.toFixed(2),
  r.total.toFixed(2),
  r.payment,
  `"${r.remarks}"`
].join(","));
  });

  const blob = new Blob([rows.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sales_report.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
