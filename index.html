<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      background: #f4f4f4;
    }

    header {
      display: flex;
      gap: 12px;
      padding: 14px;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header button {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    header button.active {
      background: #ff7a00;
      color: #000;
      font-weight: 600;
    }
header {
  position: relative;
  z-index: 1000;
}

section {
  position: relative;
}


    .container {
      max-width: 1300px;
      margin: auto;
      padding: 24px;
    }

section[hidden] {
  display: none;
}
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      border-bottom: 2px solid #eee;
      padding-bottom: 6px;
    }

    /* ---------- FORM GRIDS ---------- */

    .form-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .form-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .full-row {
      grid-column: 1 / -1;
    }

    label {
      font-size: 12px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 4px;
      font-size: 14px;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    button.primary {
      background: #ff7a00;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    button.danger {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    button.small {
      padding: 6px 10px;
      font-size: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      vertical-align: top;
    }

    th {
      background: #f0f0f0;
    }

    .address-cell {
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .address-cell:hover {
      white-space: normal;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .kpi {
      background: #fafafa;
      border-left: 6px solid #ff7a00;
      padding: 14px;
      border-radius: 8px;
    }

    .kpi .label {
      font-size: 12px;
      color: #777;
    }

    .kpi .value {
      font-size: 22px;
      font-weight: 700;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    canvas { max-height: 260px; }

    @media (max-width: 900px) {
      .form-grid-4,
      .form-grid-3,
      .form-grid-2,
      .chart-grid,
      .kpi-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <button id="tabClients" class="active">Clients</button>
  <button id="tabPractitioners">Practitioners</button>
  <button id="tabAppointments">Appointments</button>
  <button id="tabReports">Sales Report</button>
</header>

<div class="container">

<!-- ================= CLIENTS ================= -->
<section id="clientsTab">
  <div class="card">
    <div class="section-title">Clients</div>
    <input type="hidden" id="client_id">

    <div class="form-grid-4">
      <div><label>Name</label><input id="c_name"></div>
      <div><label>DOB</label><input type="date" id="c_dob"></div>
      <div><label>Gender</label><select id="c_gender"><option>Male</option><option>Female</option></select></div>
      <div><label>Citizenship</label><select id="c_citizenship"><option>Malaysian</option><option>Foreigner</option></select></div>
    </div>

    <div class="form-grid-3" style="margin-top:16px">
      <div><label>IC / Passport</label><input id="c_ic"></div>
      <div><label>Contact</label><input id="c_contact"></div>
      <div><label>Email</label><input id="c_email"></div>
    </div>

    <div class="form-grid-2" style="margin-top:16px">
      <div class="full-row"><label>Address (Optional)</label><textarea id="c_address"></textarea></div>
    </div>


    <div style="margin-top:16px">
      <button class="primary" id="saveClientBtn">Save</button>
      <button class="primary" id="cancelClientBtn">Cancel</button>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>DOB</th><th>Age</th><th>Gender</th><th>Citizen</th>
          <th>IC / Passport</th><th>Contact</th><th>Email</th><th>Address</th>
          <th>Edit</th><th>Delete</th>
        </tr>
      </thead>
      <tbody id="clientsTable"></tbody>
    </table>
  </div>

  <button class="primary" onclick="loadClients()">Refresh</button>
</section>



<!-- ================= PRACTITIONERS ================= -->
<section id="practitionersTab" hidden>
  <div class="card">
    <div class="section-title">Practitioners</div>
    <input id="p_name">
    <button class="primary" id="addPractitionerBtn">Add</button>

    <table>
      <thead><tr><th>Name</th><th>Delete</th></tr></thead>
      <tbody id="practitionerTable"></tbody>
    </table>
  </div>
</section>

<!-- ================= APPOINTMENTS ================= -->
<section id="appointmentsTab" hidden>
  <div class="card">
    <div class="section-title">Appointments</div>
    <input type="hidden" id="appointment_id">

    <div class="form-grid-2">
      <div><label>Date</label><input type="date" id="a_date"></div>
      <div><label>Time</label><input type="time" id="a_time"></div>
      <div><label>Client</label><select id="a_client"></select></div>
      <div><label>Practitioner</label><select id="a_practitioner"></select></div>
    </div>

    <div class="form-grid-2" style="margin-top:16px">
      <div><label>Service</label><select id="a_service"></select></div>
      <div><label>Payment</label><select id="a_payment"><option>Cash</option><option>Card</option><option>E‑Wallet</option></select></div>
    </div>

    <div class="form-grid-3" style="margin-top:16px">
      <div><label>Base (RM)</label><input id="a_price" readonly></div>
      <div><label>SST (RM)</label><input id="a_sst" readonly></div>
      <div><label>Total (RM)</label><input id="a_total" readonly></div>
    </div>

    <div class="form-grid-1 full-row" style="margin-top:16px">
      <label>Remarks</label>
      <textarea id="a_remarks"></textarea>
    </div>

    <div style="margin-top:16px">
      <button class="primary" id="saveAppointmentBtn">Save</button>
      <button class="primary" id="cancelAppointmentBtn">Cancel</button>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th><th>Time</th><th>Client</th><th>Service</th>
          <th>Practitioner</th><th>Payment</th><th>Total</th>
          <th>Edit</th><th>Delete</th>
        </tr>
      </thead>
      <tbody id="appointmentsTable"></tbody>
    </table>
  </div>
</section>

<!-- ================= SALES REPORT ================= -->
<section id="reportsTab" hidden>
  <div class="card">
    <div class="section-title">Sales Report</div>
    <input type="date" id="reportFrom">
    <input type="date" id="reportTo">
    <button class="primary" id="applyReportBtn">Generate</button>
    <button class="primary" id="exportExcelBtn">Export Excel</button>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="label">Total Income</div><div class="value" id="kpiTotalIncome">RM 0.00</div></div>
    <div class="kpi"><div class="label">Total SST</div><div class="value" id="kpiTotalSST">RM 0.00</div></div>
    <div class="kpi"><div class="label">Transactions</div><div class="value" id="kpiTxn">0</div></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th><th>Time</th><th>Client</th><th>Service</th>
          <th>Practitioner</th><th>Payment</th><th>Subtotal</th><th>SST</th><th>Total</th>
        </tr>
      </thead>
      <tbody id="reportDetailTable"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="chart-grid">
      <canvas id="serviceCountChart"></canvas>
      <canvas id="serviceRevenueChart"></canvas>
    </div>
    <div class="chart-grid">
      <canvas id="paymentRevenueChart"></canvas>
      <canvas id="ageRevenueChart"></canvas>
    </div>
  </div>
</section>

</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://fmwdizyexroiezezitly.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= SERVICES ================= */
const SERVICES = [
  { id:"SM", name:"Sports Massage", price:45 },
  { id:"RCB", name:"Recovery Compression Boots", price:25 },
  { id:"AS", name:"Assisted Stretch Session", price:20 },
  { id:"PB", name:"Physio Bundle", price:400 },
  { id:"PKP", name:"Performance Kickstart Program", price:261 },
  { id:"SMFT", name:"Sports Massage - First Trial", price:189 },
  { id:"QF15", name:"Quick Fix 15 minutes", price:15 }
];

/* ================= HELPERS ================= */
function calcAge(dob) {
  if (!dob) return "";
  return Math.floor((Date.now() - new Date(dob)) / 31557600000);
}
function fmtDate(d) {
  if (!d) return "";
  return new Date(d).toISOString().split("T")[0];
}

  function fmtDMY(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  const day = String(d.getDate()).padStart(2,"0");
  const month = String(d.getMonth()+1).padStart(2,"0");
  const year = d.getFullYear();
  return `${day}/${month}/${year}`;
}
  
  /* FORMATTERS */
function formatIC(input) {
  let v = input.value.replace(/\D/g, "");
  if (v.length > 6) v = v.slice(0,6) + "-" + v.slice(6);
  if (v.length > 9) v = v.slice(0,9) + "-" + v.slice(9);
  input.value = v;
}
function formatContact(input) {
  let v = input.value.replace(/\D/g, "");
  if (v.length > 3) v = v.slice(0,3) + "-" + v.slice(3);
  input.value = v;
}
  

/* ================= CLIENTS ================= */
async function loadClients() {
  const { data, error } = await sb.from("clients").select("*").order("created_at", { ascending: false });
  if (error) { console.error(error); return; }

  clients = data || [];

  // table
  const table = document.getElementById("clientsTable");
  table.innerHTML = "";
  clients.forEach(c => {
    table.innerHTML += `
      <tr>
        <td>${c.full_name || ""}</td>
        <td>${fmtDMY(c.date_of_birth)}</td>
        <td>${calcAge(c.date_of_birth)}</td>
        <td>${c.gender || ""}</td>
        <td>${c.citizenship || ""}</td>
        <td>${c.ic_passport || ""}</td>
        <td>${c.contact || ""}</td>
        <td>${c.email || ""}</td>
        <td>${c.address || ""}</td>
        <td><button onclick="editClient('${c.id}')">✏️</button></td>
        <td><button onclick="deleteClient('${c.id}')">🗑</button></td>
      </tr>`;
  });

  // dropdown for appointments
  const clientSelect = document.getElementById("a_client");
  clientSelect.innerHTML = "<option value=''>Select Client</option>";
  clients.forEach(c => {
    clientSelect.innerHTML += `<option value="${c.id}">${c.full_name}</option>`;
  });
}

function editClient(id) {
  sb.from("clients").select("*").eq("id", id).single().then(({ data }) => {
    if (!data) return;
    client_id.value = data.id;
    c_name.value = data.full_name || "";
    c_dob.value = fmtDate(data.date_of_birth);
    c_gender.value = data.gender || "Male";
    c_citizenship.value = data.citizenship || "Malaysian";
    c_ic.value = data.ic_passport || "";
    c_contact.value = data.contact || "";
    c_email.value = data.email || "";
    c_address.value = data.address || "";
  });
}

async function deleteClient(id) {
  if (!confirm("Delete client?")) return;
  await sb.from("clients").delete().eq("id", id);
  loadClients();
}

document.getElementById("saveClientBtn").onclick = async () => {
  if (!c_name.value || !c_dob.value) return alert("Name & DOB required");
  const payload = {
    full_name: c_name.value,
    date_of_birth: c_dob.value,
    gender: c_gender.value,
    citizenship: c_citizenship.value,
    ic_passport: c_ic.value,
    contact: c_contact.value,
    email: c_email.value,
    address: c_address.value || null
  };
  if (client_id.value) {
    await sb.from("clients").update(payload).eq("id", client_id.value);
  } else {
    await sb.from("clients").insert(payload);
  }
  cancelClientBtn.click();
  loadClients();
};

document.getElementById("cancelClientBtn").onclick = () => {
  client_id.value = "";
  c_name.value = "";
  c_dob.value = "";
  c_gender.value = "Male";
  c_citizenship.value = "Malaysian";
  c_ic.value = "";
  c_contact.value = "";
  c_email.value = "";
  c_address.value = "";
};

/* ================= PRACTITIONERS ================= */
async function loadPractitioners() {
  const { data, error } = await sb.from("practitioners").select("*").order("name");
  if (error) return console.error(error);

  practitioners = data || [];
  a_practitioner.innerHTML = "<option value=''>Select Practitioner</option>";
  practitioners.forEach(p => {
    a_practitioner.innerHTML += `<option value="${p.id}">${p.name}</option>`;
  });

  practitionerTable.innerHTML = "";
  practitioners.forEach(p => {
    practitionerTable.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td><button onclick="deletePractitioner('${p.id}')">🗑</button></td>
      </tr>`;
  });
}

document.getElementById("addPractitionerBtn").onclick = async ()=>{
  if(!p_name.value) return;
  await sb.from("practitioners").insert({ name:p_name.value });
  p_name.value="";
  loadPractitioners();
};

window.deletePractitioner = async id=>{
  if(!confirm("Delete practitioner?")) return;
  await sb.from("practitioners").delete().eq("id",id);
  loadPractitioners();
};

/* ================= APPOINTMENTS ================= */

// populate service dropdown once
SERVICES.forEach(s=>{
  a_service.innerHTML += `<option value="${s.id}">${s.name}</option>`;
});

// recalc totals when service or client changes
function recalcAppointment(){
  const s = SERVICES.find(x=>x.id===a_service.value);
  const c = clients.find(x=>x.id===a_client.value);
  const sstEligible = ["PB","PKP","SMFT"];
  const sst = (c?.citizenship==="Foreigner" && sstEligible.includes(s.id))
    ? +(s.price*0.06).toFixed(2)
    : 0;

  a_price.value = s ? s.price : "";
  a_sst.value = s ? sst : "";
  a_total.value = s ? (s.price+sst).toFixed(2) : "";
}
a_service.onchange = recalcAppointment;
a_client.onchange = recalcAppointment;

// load appointments table
async function loadAppointments() {
  const { data, error } = await sb.from("appointments").select("*").order("start_time");
  if (error) { console.error(error); return; }

  appointments = data || [];
  appointmentsTable.innerHTML = "";

  appointments.forEach(a => {
    const clientName = clients.find(c => c.id === a.client_id)?.full_name || "";
    const serviceName = SERVICES.find(s => s.id === a.service_id)?.name || "";
    const practitionerName = practitioners.find(p => p.id === a.practitioner_id)?.name || "";

    appointmentsTable.innerHTML += `
      <tr>
        <td>${fmtDMY(a.start_time)}</td>
        <td>${a.start_time.slice(11,16)}</td>
        <td>${clientName}</td>
        <td>${serviceName}</td>
        <td>${practitionerName}</td>
        <td>${a.payment_method}</td>
        <td>${a.total}</td>
        <td><button class="small" onclick="editAppointment('${a.id}')">✏️</button></td>
        <td><button class="danger small" onclick="deleteAppointment('${a.id}')">🗑</button></td>
      </tr>`;
  });
}

// edit existing appointment
window.editAppointment = id=>{
  const a = appointments.find(x=>x.id===id);
  if (!a) return;
  appointment_id.value = a.id;
  a_date.value = a.start_time.slice(0,10); // input type=date expects ISO
  a_time.value = a.start_time.slice(11,16);
  a_client.value = a.client_id;
  a_service.value = a.service_id;
  a_practitioner.value = a.practitioner_id;
  a_payment.value = a.payment_method;
  a_remarks.value = a.remarks || "";
  recalcAppointment();
};

// save appointment (insert or update)
document.getElementById("saveAppointmentBtn").onclick = async ()=>{
  const s = SERVICES.find(x=>x.id===a_service.value);
  const c = clients.find(x=>x.id===a_client.value);
  if (!s || !c) return alert("Please select client and service");

  const sstEligible = ["PB","PKP","SMFT"];
  const sst = (c.citizenship==="Foreigner" && sstEligible.includes(s.id))
    ? +(s.price*0.06).toFixed(2)
    : 0;
  const startTime = `${a_date.value}T${a_time.value}:00Z`;

  const payload = {
    client_id: c.id,
    service_id: s.id,
    practitioner_id: a_practitioner.value,
    payment_method: a_payment.value,
    remarks: a_remarks.value,
    amount: s.price,
    sst,
    total: s.price+sst,
    start_time: startTime,
    end_time: startTime
  };

  if (appointment_id.value) {
    await sb.from("appointments").update(payload).eq("id", appointment_id.value);
  } else {
    await sb.from("appointments").insert(payload);
  }

  cancelAppointmentBtn.click();
  loadAppointments();
};

// delete appointment
window.deleteAppointment = async id=>{
  if (!confirm("Delete appointment?")) return;
  await sb.from("appointments").delete().eq("id", id);
  loadAppointments();
};

// cancel form
cancelAppointmentBtn.onclick = ()=>{
  appointment_id.value = "";
  a_date.value = "";
  a_time.value = "";
  a_client.value = "";
  a_service.value = "";
  a_practitioner.value = "";
  a_payment.value = "";
  a_remarks.value = "";
  a_price.value = "";
  a_sst.value = "";
  a_total.value = "";
};

// set default date/time on load
window.onload = () => {
  loadClients();
  loadPractitioners();
  loadAppointments();

  document.getElementById("c_ic").addEventListener("input", e => formatIC(e.target));
  document.getElementById("c_contact").addEventListener("input", e => formatContact(e.target));

  const now = new Date();
  a_date.value = now.toISOString().slice(0,10); // input type=date expects ISO
  a_time.value = now.toTimeString().slice(0,5);
};


  
 /* ================= SALES REPORT ================= */
applyReportBtn.onclick = () => {
  const serviceCount = {}, serviceRevenue = {}, paymentRevenue = {}, ageRevenue = {};
  let totalIncome = 0, totalSST = 0;
  reportDetailTable.innerHTML = "";

  appointments.forEach(a => {
    const date = a.start_time.slice(0,10);
    if (date < reportFrom.value || date > reportTo.value) return;

    const svc = SERVICES.find(s => s.id === a.service_id)?.name || "";
    const cli = clients.find(c => c.id === a.client_id);
    const ag = calcAge(cli.date_of_birth);
    const ageGroup = ag < 18 ? "<18" : ag < 30 ? "18–29" : ag < 40 ? "30–39" : ag < 50 ? "40–49" : "50+";

    serviceCount[svc] = (serviceCount[svc] || 0) + 1;
    serviceRevenue[svc] = (serviceRevenue[svc] || 0) + Number(a.total);
    paymentRevenue[a.payment_method] = (paymentRevenue[a.payment_method] || 0) + Number(a.total);
    ageRevenue[ageGroup] = (ageRevenue[ageGroup] || 0) + Number(a.total);

    totalIncome += Number(a.total);
    totalSST += Number(a.sst);

    reportDetailTable.innerHTML += `
      <tr>
        <td>${date}</td>
        <td>${a.start_time.slice(11,16)}</td>
        <td>${cli.full_name}</td>
        <td>${svc}</td>
        <td>${practitioners.find(p => p.id === a.practitioner_id)?.name || ""}</td>
        <td>${a.payment_method}</td>
        <td>${a.amount}</td>
        <td>${a.sst}</td>
        <td>${a.total}</td>
      </tr>`;
  });

  kpiTotalIncome.textContent = `RM ${totalIncome.toFixed(2)}`;
  kpiTotalSST.textContent = `RM ${totalSST.toFixed(2)}`;
  kpiTxn.textContent = appointments.filter(a => {
    const date = a.start_time.slice(0,10);
    return date >= reportFrom.value && date <= reportTo.value;
  }).length;

  serviceCountChart && serviceCountChart.destroy();
  serviceRevenueChart && serviceRevenueChart.destroy();
  paymentRevenueChart && paymentRevenueChart.destroy();
  ageRevenueChart && ageRevenueChart.destroy();

  serviceCountChart = new Chart(ctx("serviceCountChart"), {
    type: "bar",
    data: { labels: Object.keys(serviceCount), datasets: [{ data: Object.values(serviceCount) }] }
  });
  serviceRevenueChart = new Chart(ctx("serviceRevenueChart"), {
    type: "pie",
    data: { labels: Object.keys(serviceRevenue), datasets: [{ data: Object.values(serviceRevenue) }] }
  });
  paymentRevenueChart = new Chart(ctx("paymentRevenueChart"), {
    type: "pie",
    data: { labels: Object.keys(paymentRevenue), datasets: [{ data: Object.values(paymentRevenue) }] }
  });
  ageRevenueChart = new Chart(ctx("ageRevenueChart"), {
    type: "pie",
    data: { labels: Object.keys(ageRevenue), datasets: [{ data: Object.values(ageRevenue) }] }
  });
};

exportExcelBtn.onclick = () => {
  const rows = [];
  document.querySelectorAll("#reportDetailTable tr").forEach(tr => {
    const t = [...tr.children].map(td => td.textContent);
    rows.push({ Date:t[0], Time:t[1], Client:t[2], Service:t[3], Practitioner:t[4], Payment:t[5], Subtotal:t[6], SST:t[7], Total:t[8] });
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Sales Detail");
  XLSX.writeFile(wb, "sales_report.xlsx");
};

/* ================= TAB SWITCHING ================= */

 function showTab(tabId) {
  // hide all sections
  document.querySelectorAll("section").forEach(el => el.hidden = true);
  // show the selected section
  document.getElementById(tabId).hidden = false;

  // update active button styling
  document.querySelectorAll("header button").forEach(btn => btn.classList.remove("active"));
  const btnMap = {
    clientsTab: "tabClients",
    practitionersTab: "tabPractitioners",
    appointmentsTab: "tabAppointments",
    reportsTab: "tabReports"
  };
  document.getElementById(btnMap[tabId]).classList.add("active");
}


document.getElementById("tabClients").onclick = () => showTab("clientsTab");
document.getElementById("tabPractitioners").onclick = () => showTab("practitionersTab");
document.getElementById("tabAppointments").onclick = () => showTab("appointmentsTab");
document.getElementById("tabReports").onclick = () => showTab("reportsTab");
