<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sports Rehab System</title>

  <!-- Supabase JS (logic will come later) -->
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{margin:0;font-family:Segoe UI;background:#f4f6f8}
    .hidden{display:none}

    /* LOGIN */
    #loginView{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9800,#ffd180);
    }
    .login-box{
      background:#fff;
      padding:30px;
      width:340px;
      border-radius:18px;
      box-shadow:0 12px 30px rgba(0,0,0,.25);
    }
    .login-box input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border-radius:14px;
      border:1px solid #ddd;
    }
    .login-box button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:16px;
      background:orange;
      font-weight:600;
      cursor:pointer;
    }

    /* APP */
    header{
      background:black;
      padding:12px;
      display:flex;
      gap:10px;
    }
    header button{
      background:orange;
      border:none;
      padding:10px 14px;
      border-radius:16px;
      font-weight:600;
      cursor:pointer;
    }

    .container{padding:20px}

    .card{
      background:white;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
      box-shadow:0 2px 14px rgba(0,0,0,.08);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    input, select{
      padding:12px;
      border-radius:14px;
      border:1px solid #ddd;
      width:100%;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
    }

    th, td{
      padding:10px;
      border-bottom:1px solid #eee;
      text-align:left;
    }

    .action{
      background:orange;
      border:none;
      padding:12px;
      border-radius:16px;
      font-weight:600;
      cursor:pointer;
    }

    .edit{
      color:orange;
      cursor:pointer;
      font-weight:600;
    }

    .total{
      font-weight:700;
      font-size:18px;
      margin-top:10px;
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
  <div class="login-box">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="err" style="color:red"></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView" class="hidden">

<header>
  <button onclick="tab('clientsTab')">Clients</button>
<button onclick="tab('practitionersTab')">Practitioners</button>
<button onclick="tab('appointmentsTab')">Appointments</button>
<button onclick="tab('reportsTab')">Sales Report</button>
<button onclick="logout()">Logout</button>
</header>

<div class="container">

<!-- ===== CLIENTS ===== -->
<section id="clientsTab">
  <div class="card">
    <h3>Client</h3>
    <div class="grid">
      <input placeholder="Full Name">
      <input type="date">
      <select>
        <option>Male</option>
        <option>Female</option>
      </select>
      <input placeholder="IC / Passport (14 characters)">
      <input placeholder="Contact">
      <input placeholder="Email">
      <input placeholder="Address">
    </div>
    <button class="action" onclick="saveClient()">Save Client</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>IC / Passport</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- client rows -->
      </tbody>
    </table>
  </div>
</section>

<!-- ===== PRACTITIONERS ===== -->
<section id="practitionersTab" class="hidden">
  <div class="card">
    <h3>Practitioner</h3>
    <input placeholder="Practitioner Name">
    <button class="action" onclick="addPractitioner()">Add Practitioner</button>
    <div>
      <!-- practitioner list -->
    </div>
  </div>
</section>

<!-- ===== APPOINTMENTS ===== -->
<section id="appointmentsTab" class="hidden">

  <div class="card">
    <h3>Appointment</h3>

    <div class="grid">
      <input id="apptDate" type="date">
      <input id="apptTime" type="time">

      <select id="apptClient"></select>
      <select id="apptPractitioner"></select>
      <select id="apptService"></select>

      <input id="apptAmount" placeholder="Amount (RM)" readonly>
      <input id="apptSST" placeholder="SST (RM)" readonly>
      <input id="apptTotal" placeholder="Total (RM)" readonly>
    </div>

    <button class="action" onclick="saveAppointment()">Save Appointment</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Client</th>
          <th>Service</th>
          <th>Total (RM)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="apptTable"></tbody>
    </table>
  </div>

</section>

<!-- ===== SALES REPORT ===== -->
<section id="reportsTab" class="hidden">
  <div class="card">
    <h3>Sales Report</h3>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Service</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <!-- report rows -->
      </tbody>
    </table>
    <p class="total">Total: RM 0.00</p>
  </div>
</section>

</div>
</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://fmwdizyexroiezezitly.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= GLOBAL STATE ================= */
let editingClientId = null;
let editingAppointmentId = null;

/* ================= SESSION CHECK ================= */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    openApp();
  }
})();

/* ================= AUTH ================= */
async function login() {
  err.textContent = "";

  const { error } = await sb.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if (error) {
    err.textContent = error.message;
    return;
  }

  openApp();
}

function logout() {
  sb.auth.signOut();
  location.reload();
}

function openApp() {
  loginView.classList.add("hidden");
  appView.classList.remove("hidden");
  tab("clientsTab");
  loadAll();
}

/* ================= TABS ================= */
function tab(id) {
  document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  if (id === "reportsTab") loadReport();
}

/* ================= FORMATTERS ================= */
document.querySelector('input[placeholder*="IC"]').oninput = e => {
  e.target.value = e.target.value.replace(/[^A-Za-z0-9]/g, "").slice(0, 14);
};

/* ================= CLIENTS ================= */
let clients = [];

async function loadClients() {
  const { data, error } = await sb
    .from("clients")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
  }

  clients = data || [];

  const tbody = document.querySelector("#clientsTab tbody");

  tbody.innerHTML = clients.map(c => `
    <tr>
      <td>${c.full_name}</td>
      <td>${c.ic_passport || ""}</td>
      <td class="edit" onclick='editClient(${JSON.stringify(c)})'>Edit</td>
    </tr>
  `).join("");

  const clientSelect = document.querySelector("#appointmentsTab select");
  clientSelect.innerHTML = clients.map(c =>
    `<option value="${c.id}">${c.full_name}</option>`
  ).join("");
}
/* ================= PRACTITIONERS ================= */
let practitioners = [];

async function loadPractitioners() {
  const { data, error } = await sb.from("practitioners").select("*");

  if (error) {
    console.error(error);
  }

  practitioners = data || [];

  document.querySelector("#practitionersTab div:last-child").innerHTML =
    practitioners.map(p => `<div>${p.name}</div>`).join("");

  const pracSelect = document.querySelectorAll("#appointmentsTab select")[1];
  pracSelect.innerHTML = practitioners.map(p =>
    `<option value="${p.id}">${p.name}</option>`
  ).join("");
}

/* ================= SERVICES ================= */
let services = [];

async function loadServices() {
  const { data, error } = await sb.from("services").select("*");

  if (error) {
    console.error(error);
  }

  services = data || [];

  const serviceSelect = document.querySelectorAll("#appointmentsTab select")[2];

  serviceSelect.innerHTML = services.map(s => `
    <option 
      value="${s.id}"
      data-price="${s.price}"
      data-foreigner-sst="${s.foreigner_sst}">
      ${s.name} (RM ${s.price})
    </option>
  `).join("");

  // Attach calculation listeners
  serviceSelect.addEventListener("change", calculateCharges);
  const clientSelect = document.querySelectorAll("#appointmentsTab select")[0];
  clientSelect.addEventListener("change", calculateCharges);
}
/* ================= APPOINTMENTS ================= */

/* defaults */
function setAppointmentDefaults() {
  const now = new Date();
  apptDate.value = now.toISOString().slice(0, 10);
  apptTime.value = now.toTimeString().slice(0, 5);
}

/* fill dropdowns */
function fillAppointmentDropdowns() {
  apptClient.innerHTML = clients.map(c =>
    `<option value="${c.id}">${c.full_name}</option>`
  ).join("");

  apptPractitioner.innerHTML = practitioners.map(p =>
    `<option value="${p.id}">${p.name}</option>`
  ).join("");

  apptService.innerHTML = services.map(s =>
    `<option value="${s.id}"
            data-price="${s.price}"
            data-foreigner-sst="${s.foreigner_sst}">
      ${s.name} (RM ${s.price})
    </option>`
  ).join("");
}

/* calculate amount / SST */
function calculateCharges() {
  if (!apptService.value || !apptClient.value) return;

  const price = Number(
    apptService.selectedOptions[0].dataset.price
  );

  const sstRequired =
    apptService.selectedOptions[0].dataset.foreignerSst === "true";

  const client = clients.find(c => c.id === apptClient.value);
  const isForeigner = client?.citizenship === "Foreigner";

  const sst = (sstRequired && isForeigner) ? price * 0.06 : 0;
  const total = price + sst;

  apptAmount.value = price.toFixed(2);
  apptSST.value = sst.toFixed(2);
  apptTotal.value = total.toFixed(2);
}

/* events */
apptService.onchange = calculateCharges;
apptClient.onchange = calculateCharges;

/* save */
async function saveAppointment() {
  if (!apptDate.value || !apptTime.value)
    return alert("Date and time required");

  const payload = {
    start_time: `${apptDate.value}T${apptTime.value}`,
    client_id: apptClient.value,
    practitioner_id: apptPractitioner.value,
    service_id: apptService.value,
    amount: Number(apptAmount.value),
    sst: Number(apptSST.value),
    total: Number(apptTotal.value)
  };

  const res = editingAppointmentId
    ? await sb.from("appointments")
        .update(payload)
        .eq("id", editingAppointmentId)
    : await sb.from("appointments").insert(payload);

  if (res.error) return alert(res.error.message);

  editingAppointmentId = null;
  loadAppointments();
}

/* list */
async function loadAppointments() {
  const { data, error } = await sb
    .from("appointments")
    .select(`
      id,
      start_time,
      total,
      client_id,
      practitioner_id,
      service_id,
      clients(full_name),
      services(name)
    `)
    .order("start_time", { ascending: false });

  if (error) return console.error(error);

  apptTable.innerHTML = data.map(a => `
    <tr>
      <td>${new Date(a.start_time).toLocaleString()}</td>
      <td>${a.clients.full_name}</td>
      <td>${a.services.name}</td>
      <td>${Number(a.total).toFixed(2)}</td>
      <td class="edit" onclick='editAppointment(${JSON.stringify(a)})'>Edit</td>
    </tr>
  `).join("");
}

/* edit */
function editAppointment(a) {
  editingAppointmentId = a.id;

  const d = new Date(a.start_time);
  apptDate.value = d.toISOString().slice(0, 10);
  apptTime.value = d.toTimeString().slice(0, 5);
  apptClient.value = a.client_id;
  apptPractitioner.value = a.practitioner_id;
  apptService.value = a.service_id;

  calculateCharges();
  tab("appointmentsTab");
}

/* ================= REPORT ================= */
async function loadReport() {
  const { data } = await sb
    .from("appointments")
    .select("start_time, services(name,price)");

  let total = 0;
  const tbody = document.querySelector("#reportsTab tbody");

  tbody.innerHTML = data.map(r => {
    total += Number(r.services.price);
    return `
      <tr>
        <td>${new Date(r.start_time).toLocaleDateString()}</td>
        <td>${r.services.name}</td>
        <td>${r.services.price}</td>
      </tr>
    `;
  }).join("");

  document.querySelector(".total").innerHTML =
    `Total: RM ${total.toFixed(2)}`;
}

/* ================= LOAD ALL ================= */
async function loadAll() {
  await loadClients();
  await loadPractitioners();
  await loadServices();

  fillAppointmentDropdowns();
  setAppointmentDefaults();
  loadAppointments();
}


</script>

    
</body>
</html>
