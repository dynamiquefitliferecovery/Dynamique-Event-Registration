<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sports Rehab System</title>

  <!-- Supabase JS (logic will come later) -->
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

    body {
  margin: 0;
  font-family: Segoe UI;
  background: #f4f6f8;
}

.hidden {
  display: none;
}

/* LOGIN */
#loginView {
  height: 100vh;
  background: linear-gradient(135deg,#ff9800,#ffd180);
}

#loginView {
  position: fixed;
  inset: 0;
  z-index: 1000;
}

#loginView:not(.hidden) {
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-box {
  background:#fff;
  padding:30px;
  width:340px;
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);
}
    
    .login-box input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border-radius:14px;
      border:1px solid #ddd;
    }
    .login-box button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:16px;
      background:orange;
      font-weight:600;
      cursor:pointer;
    }

    /* APP */
    header{
      background:black;
      padding:12px;
      display:flex;
      gap:10px;
    }
    header button{
      background:orange;
      border:none;
      padding:10px 14px;
      border-radius:16px;
      font-weight:600;
      cursor:pointer;
    }

    .container{padding:20px}

    .card{
      background:white;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
      box-shadow:0 2px 14px rgba(0,0,0,.08);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    input, select{
      padding:12px;
      border-radius:14px;
      border:1px solid #ddd;
      width:100%;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
    }

    th, td{
      padding:10px;
      border-bottom:1px solid #eee;
      text-align:left;
    }

    .action{
      background:orange;
      border:none;
      padding:12px;
      border-radius:16px;
      font-weight:600;
      cursor:pointer;
    }

    .edit{
      color:orange;
      cursor:pointer;
      font-weight:600;
    }

    .total{
      font-weight:700;
      font-size:18px;
      margin-top:10px;
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
  <div class="login-box">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button type="button" onclick="login()">Login</button>
    <p id="err" style="color:red"></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView" class="hidden">

<header>
  <button onclick="tab('clientsTab')">Clients</button>
<button onclick="tab('practitionersTab')">Practitioners</button>
<button onclick="tab('appointmentsTab')">Appointments</button>
<button onclick="tab('reportsTab')">Sales Report</button>
<button onclick="logout()">Logout</button>
</header>

<div class="container">

<!-- ===== CLIENTS ===== -->
<section id="clientsTab">
  <div class="card">
    <h3>Client</h3>
    <div class="grid">
      <input placeholder="Full Name">
      <input type="date">
      <select>
        <option>Male</option>
        <option>Female</option>
      </select>
      <select>
  <option value="Malaysian">Malaysian</option>
  <option value="Foreigner">Foreigner</option>
</select>
      <input placeholder="IC / Passport (14 characters)">
      <input placeholder="Contact">
      <input placeholder="Email">
      <input placeholder="Address">
    </div>
    <button class="action" onclick="saveClient()">Save Client</button>
  </div>

  <div class="card">
    <table>
      <thead>
  <tr>
    <th>Full Name</th>
    <th>DOB</th>
    <th>Gender</th>
    <th>Citizenship</th>
    <th>IC / Passport</th>
    <th>Contact</th>
    <th>Email</th>
    <th>Action</th>
  </tr>
</thead>
<tbody id="clientsTable">
  <!-- client rows -->
</tbody>
    </table>
  </div>
</section>

<!-- ===== PRACTITIONERS ===== -->
<section id="practitionersTab" class="hidden">
  <div class="card">
    <h3>Practitioner</h3>
    <input placeholder="Practitioner Name">
    <button class="action" onclick="addPractitioner()">Add Practitioner</button>
    <div>
      <div id="practitionerList"></div>
      <!-- practitioner list -->
    </div>
  </div>
</section>

<!-- ===== APPOINTMENTS ===== -->
<section id="appointmentsTab" class="hidden">

  <div class="card">
    <h3>Appointment</h3>

    <div class="grid">
      <input id="apptDate" type="date">
      <input id="apptTime" type="time">

      <select id="apptClient"></select>
      <select id="apptPractitioner"></select>
      <select id="apptService"></select>
      <select id="apptPayment">
  <option value="">Select Payment</option>
  <option value="Cash">Cash</option>
  <option value="Card">Card</option>
  <option value="Online">Online</option>
</select>

<input id="apptRemarks" placeholder="Remarks (optional)">

      <input id="apptAmount" placeholder="Amount (RM)" readonly>
      <input id="apptSST" placeholder="SST (RM)" readonly>
      <input id="apptTotal" placeholder="Total (RM)" readonly>
    </div>

    <button class="action" onclick="saveAppointment()">Save Appointment</button>
  </div>

  <div class="card">
    <table>
      <thead>
  <tr>
    <th>Date</th>
    <th>Client</th>
    <th>Service</th>
    <th>Amount</th>
    <th>SST</th>
    <th>Total</th>
    <th>Payment</th>
    <th>Remarks</th>
    <th>Action</th>
  </tr>
</thead>
      <tbody id="apptTable"></tbody>
    </table>
  </div>

</section>

<!-- ===== SALES REPORT ===== --> 
  <section id="reportsTab" class="hidden">
  <div class="card">
    <h3>Sales Report</h3>
      <input type="date" id="reportFrom">
<input type="date" id="reportTo">
<button class="action" onclick="loadReport()">Generate</button>
    <table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Service</th>
      <th>Amount</th>
    </tr>
  </thead>
  <tbody id="reportTable"></tbody>
</table>

<p class="total">Total: RM 0.00</p>
  </div>
</section>

</div>
</div>

<script>
console.log("JS loaded");
// ✅ Explicit DOM bindings
const apptDate = document.getElementById("apptDate");
const apptTime = document.getElementById("apptTime");
const apptClient = document.getElementById("apptClient");
const apptPractitioner = document.getElementById("apptPractitioner");
const apptService = document.getElementById("apptService");
const apptPayment = document.getElementById("apptPayment");
const apptRemarks = document.getElementById("apptRemarks");

const apptAmount = document.getElementById("apptAmount");
const apptSST = document.getElementById("apptSST");
const apptTotal = document.getElementById("apptTotal");

const apptTable = document.getElementById("apptTable");


  
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://fmwdizyexroiezezitly.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" && session) {
    openApp();
  }

  if (event === "SIGNED_OUT") {
    location.reload();
  }
});

/* ================= GLOBAL STATE ================= */
let editingClientId = null;
let editingAppointmentId = null;

/* ================= SESSION CHECK ================= */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    openApp();
  }
})();

/* ================= AUTH ================= */
async function login() {
  console.log("login() triggered"); // 👈 MUST appear when clicking button

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const errEl = document.getElementById("err");

  errEl.textContent = "";

  const { data, error } = await sb.auth.signInWithPassword({
    email: emailInput.value,
    password: passwordInput.value
  });

  console.log("Auth response:", data, error);

  if (error) {
    errEl.textContent = error.message;
    return;
  }

  if (data.session) {
    openApp();
  }
}

// ✅ THIS LINE FIXES EVERYTHING
window.login = login;

 
function logout() {
  sb.auth.signOut();
  location.reload();
}

  console.log("openApp function exists:", typeof openApp);
function openApp() {
  const loginViewEl = document.getElementById("loginView");
  const appViewEl = document.getElementById("appView");

  if (!loginViewEl || !appViewEl) {
    console.error("loginView or appView not found");
    return;
  }

  loginViewEl.classList.add("hidden");
  appViewEl.classList.remove("hidden");

  tab("clientsTab");
  loadAll();
}


/* ================= TABS ================= */
function tab(id) {
  document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  if (id === "reportsTab") loadReport();
}

/* ================= FORMATTERS ================= */
document.addEventListener("input", e => {
  if (e.target.matches('input[placeholder*="IC"]')) {
    let v = e.target.value.replace(/\D/g, "").slice(0,14);

    if (v.length > 12) {
      v = v.replace(/(\d{6})(\d{6})(\d{0,2})/, "$1-$2-$3");
    } else if (v.length > 6) {
      v = v.replace(/(\d{6})(\d{0,6})/, "$1-$2");
    }

    e.target.value = v;
  }
});

function formatIc(v = "") {
  return v ? v.replace(/(.{6})(.{2})(.{6})/, "$1-$2-$3") : "";
}

function formatContact(v = "") {
  return v ? v.replace(/(\d{3})(\d{3,4})(\d{4})/, "$1-$2-$3") : "";
}
  
/* ================= CLIENTS ================= */
let clients = [];

async function loadClients() {
  const { data, error } = await sb
    .from("clients")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  clients = data || [];

  const tbody = document.getElementById("clientsTable");


tbody.innerHTML = clients.map(c => `
  <tr>
    <td>${c.full_name}</td>
    <td>${c.date_of_birth || ""}</td>
    <td>${c.gender || ""}</td>
    <td>${c.citizenship || ""}</td>
    <td>${formatIc(c.ic_passport)}</td>
    <td>${formatContact(c.contact)}</td>
    <td>${c.email || ""}</td>
    <td>
      <span class="edit" onclick='editClient(${JSON.stringify(c)})'>Edit</span> |
      <span class="edit" onclick="deleteClient(${c.id})">Delete</span>
    </td>
  </tr>
`).join("");
}
async function saveClient() {
  const inputs = document.querySelectorAll("#clientsTab input");
  const selects = document.querySelectorAll("#clientsTab select");

const payload = {
  full_name: inputs[0].value,
  date_of_birth: inputs[1].value,
  gender: selects[0].value,        // ✅ Gender
  citizenship: selects[1].value,  // ✅ Citizenship
  ic_passport: inputs[2].value,
  contact: inputs[3].value,
  email: inputs[4].value,
  address: inputs[5].value

  };

  if (!payload.full_name) {
    alert("Full Name is required");
    return;
  }

  const res = editingClientId
    ? await sb.from("clients").update(payload).eq("id", editingClientId)
    : await sb.from("clients").insert(payload);

  if (res.error) {
    alert(res.error.message);
    return;
  }

  editingClientId = null;
  inputs.forEach(i => i.value = "");
  loadClients();
}

function editClient(c) {
  editingClientId = c.id;

  const inputs = document.querySelectorAll("#clientsTab input");
  const selects = document.querySelectorAll("#clientsTab select");

  inputs[0].value = c.full_name || "";
  inputs[1].value = c.date_of_birth || "";
  selects[0].value = c.gender || "Male";
  selects[1].value = c.citizenship || "Malaysian";
  inputs[2].value = c.ic_passport || "";
  inputs[3].value = c.contact || "";
  inputs[4].value = c.email || "";
  inputs[5].value = c.address || "";
}

async function deleteClient(id) {
  if (!confirm("Delete this client?")) return;

  const { error } = await sb
    .from("clients")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  loadClients();
}




/* ================= PRACTITIONERS ================= */
let practitioners = [];

async function addPractitioner() {
  const input = document.querySelector("#practitionersTab input");

  if (!input.value) {
    alert("Practitioner name required");
    return;
  }

  const res = await sb
    .from("practitioners")
    .insert({ name: input.value });

  if (res.error) {
    alert(res.error.message);
    return;
  }

  input.value = "";
  loadPractitioners();
}

async function loadPractitioners() {
  const { data, error } = await sb.from("practitioners").select("*");

  if (error) {
    console.error(error);
    return;
  }

  practitioners = data || [];

 document.getElementById("practitionerList").innerHTML =
  practitioners.map(p => `
    <div>
      ${p.name}
      <span class="edit" onclick="deletePractitioner(${p.id})">Delete</span>
    </div>
  `).join("");
}

async function deletePractitioner(id) {
  if (!confirm("Delete practitioner?")) return;

  const { error } = await sb.from("practitioners").delete().eq("id", id);
  if (error) return alert(error.message);

  loadPractitioners();
}
  
/* ================= SERVICES ================= */
let services = [];

async function loadServices() {
  const { data, error } = await sb
    .from("services")
    .select("id, code, name, price, sst");

  if (error) {
    console.error("loadServices error:", error);
    return;
  }

  services = data || [];

  // IMPORTANT: value = s.id (BIGINT), NOT s.code
  apptService.innerHTML = services.map(s => `
    <option
      value="${s.id}"
      data-price="${s.price}"
      data-sst="${s.sst}">
      ${s.code} – ${s.name} (RM ${s.price})
    </option>
  `).join("");
}

 
/* ================= APPOINTMENTS ================= */

/* defaults */
function setAppointmentDefaults() {
  const now = new Date();
  apptDate.value = now.toISOString().slice(0, 10);
  apptTime.value = now.toTimeString().slice(0, 5);
}

/* fill dropdowns */
function fillAppointmentDropdowns() {
  apptClient.innerHTML = clients.map(c =>
    `<option value="${c.id}">${c.full_name}</option>`
  ).join("");

  apptPractitioner.innerHTML = practitioners.map(p =>
    `<option value="${p.id}">${p.name}</option>`
  ).join("");

  if (!apptService.options.length) {
    apptService.innerHTML = services.map(s =>
      `<option value="${s.id}"
              data-price="${s.price}"
              data-sst="${s.sst}">
        ${s.code} – ${s.name} (RM ${s.price})
      </option>`
    ).join("");
  }
}

/* calculate amount / SST */
function calculateCharges() {
  if (!apptService.value || !apptClient.value) return;

  const selectedService = apptService.selectedOptions[0];
  if (!selectedService) return; // ✅ DEFENSIVE FIX

  const price = Number(selectedService.dataset.price);
  const serviceHasSST = selectedService.dataset.sst === "true";

  const client = clients.find(c => c.id === apptClient.value);
  const isForeigner = client?.citizenship === "Foreigner";

  const sst = (serviceHasSST && isForeigner)
    ? price * 0.06
    : 0;

  const total = price + sst;

  apptAmount.value = price.toFixed(2);
  apptSST.value = sst.toFixed(2);
  apptTotal.value = total.toFixed(2);
}


/* events */
document.addEventListener("DOMContentLoaded", () => {
  apptService.onchange = calculateCharges;
  apptClient.onchange = calculateCharges;
});
  
/* save */
async function saveAppointment() {
  if (!apptDate.value || !apptTime.value)
    return alert("Date and time required");
if (!apptPayment.value) {
  alert("Please select a payment method");
  return;
}
  

  const payload = {
  start_time: `${apptDate.value}T${apptTime.value}`,
  client_id: apptClient.value,
  practitioner_id: apptPractitioner.value,
  service_id: apptService.value,
  payment_method: apptPayment.value || null, // ✅ NEW
  remarks: apptRemarks.value || null,         // ✅ NEW
  amount: Number(apptAmount.value),
  sst: Number(apptSST.value),
  total: Number(apptTotal.value)
};

  const res = editingAppointmentId
    ? await sb.from("appointments")
        .update(payload)
        .eq("id", editingAppointmentId)
    : await sb.from("appointments").insert(payload);

  if (res.error) return alert(res.error.message);

  editingAppointmentId = null;
  loadAppointments();
}

/* list */
async function loadAppointments() {
  const { data, error } = await sb
    .from("appointments")
    .select(`
      id,
      start_time,
      amount,
      sst,
      total,
      payment_method,
      remarks,
      client_id,
      practitioner_id,
      service_id,
      clients(full_name),
      service:services!appointments_service_id_fkey(name)
    `)
    .order("start_time", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  apptTable.innerHTML = data.map(a => `
    <tr>
      <td>${new Date(a.start_time).toLocaleString()}</td>
      <td>${a.clients.full_name}</td>
      <td>${a.service?.name || ""}</td>
      <td>${Number(a.amount).toFixed(2)}</td>
      <td>${Number(a.sst).toFixed(2)}</td>
      <td>${Number(a.total).toFixed(2)}</td>
      <td>${a.payment_method || ""}</td>
      <td>${a.remarks || ""}</td>
      <td class="edit" onclick='editAppointment(${JSON.stringify(a)})'>
        Edit
      </td>
    </tr>
  `).join("");
}

/* edit */
function editAppointment(a) {
  editingAppointmentId = a.id;

  fillAppointmentDropdowns();

  const d = new Date(a.start_time);
  apptDate.value = d.toISOString().slice(0, 10);
  apptTime.value = d.toTimeString().slice(0, 5);
  apptClient.value = a.client_id;
  apptPractitioner.value = a.practitioner_id;
  apptService.value = a.service_id;
  apptPayment.value = a.payment_method || "";
apptRemarks.value = a.remarks || "";

  calculateCharges();
  tab("appointmentsTab");
}

/* ================= REPORT ================= */

async function loadReport() {
  const from = reportFrom.value;
  const to = reportTo.value;

  let query = sb
    .from("appointments")
    .select(`
      start_time,
      total,
      service:services!appointments_service_id_fkey(name)
    `);

  if (from) query = query.gte("start_time", from);
  if (to) query = query.lte("start_time", to + "T23:59:59");

  const { data, error } = await query;
  if (error) return console.error(error);

  let totalAmount = 0;
  const tbody = document.getElementById("reportTable");

  tbody.innerHTML = data.map(r => {
    totalAmount += Number(r.total || 0);
    return `
      <tr>
        <td>${new Date(r.start_time).toLocaleDateString()}</td>
        <td>${r.service?.name || ""}</td>
        <td>${Number(r.total).toFixed(2)}</td>
      </tr>
    `;
  }).join("");

 document.querySelector("#reportsTab .total").innerText =
  `Total: RM ${totalAmount.toFixed(2)}`;
}
/* ================= LOAD ALL ================= */
async function loadAll() {
  await loadClients();
  await loadPractitioners();
  await loadServices();

  fillAppointmentDropdowns();
  setAppointmentDefaults();
  calculateCharges();
  loadAppointments();
}

</script>

    
</body>
</html>
