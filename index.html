<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sports Rehab System</title>

  <!-- Supabase JS (logic will come later) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/s
  <style>
    body{margin:0;font-family:Segoe UI;background:#f4f6f8}
    .hidden{display:none}

    /* LOGIN */
    #loginView{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9800,#ffd180);
    }
    .login-box{
      background:#fff;
      padding:30px;
      width:340px;
      border-radius:18px;
      box-shadow:0 12px 30px rgba(0,0,0,.25);
    }
    .login-box input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border-radius:14px;
      border:1px solid #ddd;
    }
    .login-box button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:16px;
      background:orange;
      font-weight:600;
      cursor:pointer;
    }

    /* APP */
    header{
      background:black;
      padding:12px;
      display:flex;
      gap:10px;
    }
    header button{
      background:orange;
      border:none;
      padding:10px 14px;
      border-radius:16px;
      font-weight:600;
      cursor:pointer;
    }

    .container{padding:20px}

    .card{
      background:white;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
      box-shadow:0 2px 14px rgba(0,0,0,.08);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    input, select{
      padding:12px;
      border-radius:14px;
      border:1px solid #ddd;
      width:100%;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
    }

    th, td{
      padding:10px;
      border-bottom:1px solid #eee;
      text-align:left;
    }

    .action{
      background:orange;
      border:none;
      padding:12px;
      border-radius:16px;
      font-weight:600;
      cursor:pointer;
    }

    .edit{
      color:orange;
      cursor:pointer;
      font-weight:600;
    }

    .total{
      font-weight:700;
      font-size:18px;
      margin-top:10px;
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
  <div class="login-box">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button>Login</button>
    <p id="err" style="color:red"></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView" class="hidden">

<header>
  <button>Clients</button>
  <button>Practitioners</button>
  <button>Appointments</button>
  <button>Sales Report</button>
  <button>Logout</button>
</header>

<div class="container">

<!-- ===== CLIENTS ===== -->
<section id="clientsTab">
  <div class="card">
    <h3>Client</h3>
    <div class="grid">
      <input placeholder="Full Name">
      <input type="date">
      <select>
        <option>Male</option>
        <option>Female</option>
      </select>
      <input placeholder="IC / Passport (14 characters)">
      <input placeholder="Contact">
      <input placeholder="Email">
      <input placeholder="Address">
    </div>
    <button class="action">Save Client</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>IC / Passport</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- client rows -->
      </tbody>
    </table>
  </div>
</section>

<!-- ===== PRACTITIONERS ===== -->
<section id="practitionersTab" class="hidden">
  <div class="card">
    <h3>Practitioner</h3>
    <input placeholder="Practitioner Name">
    <button class="action">Add Practitioner</button>
    <div>
      <!-- practitioner list -->
    </div>
  </div>
</section>

<!-- ===== APPOINTMENTS ===== -->
<section id="appointmentsTab" class="hidden">
  <div class="card">
    <h3>Appointment</h3>
    <div class="grid">
      <input type="date">
      <input type="time">
      <select></select> <!-- client -->
      <select></select> <!-- practitioner -->
      <select></select> <!-- service -->
    </div>
    <button class="action">Save Appointment</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Client</th>
          <th>Service</th>
          <th>Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- appointment rows -->
      </tbody>
    </table>
  </div>
</section>

<!-- ===== SALES REPORT ===== -->
<section id="reportsTab" class="hidden">
  <div class="card">
    <h3>Sales Report</h3>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Service</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <!-- report rows -->
      </tbody>
    </table>
    <p class="total">Total: RM 0.00</p>
  </div>
</section>

</div>
</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://fmwdizyexroiezezitly.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= GLOBAL STATE ================= */
let editingClientId = null;
let editingAppointmentId = null;

/* ================= SESSION CHECK ================= */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    openApp();
  }
})();

/* ================= AUTH ================= */
async function login() {
  err.textContent = "";

  const { error } = await sb.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if (error) {
    err.textContent = error.message;
    return;
  }

  openApp();
}

function logout() {
  sb.auth.signOut();
  location.reload();
}

function openApp() {
  loginView.classList.add("hidden");
  appView.classList.remove("hidden");
  tab("clientsTab");
  loadAll();
}

/* ================= TABS ================= */
function tab(id) {
  document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  if (id === "reportsTab") loadReport();
}

/* ================= FORMATTERS ================= */
document.querySelector('input[placeholder*="IC"]').oninput = e => {
  e.target.value = e.target.value.replace(/[^A-Za-z0-9]/g, "").slice(0, 14);
};

/* ================= CLIENTS ================= */
async function saveClient() {
  if (!c_name.value) return alert("Full Name required");

  const payload = {
    full_name: c_name.value,
    date_of_birth: document.querySelector('input[type="date"]').value,
    gender: document.querySelector('select').value,
    ic_passport: document.querySelector('input[placeholder*="IC"]').value,
    contact: document.querySelector('input[placeholder="Contact"]').value,
    email: document.querySelector('input[placeholder="Email"]').value,
    address: document.querySelector('input[placeholder="Address"]').value
  };

  const res = editingClientId
    ? await sb.from("clients").update(payload).eq("id", editingClientId)
    : await sb.from("clients").insert(payload);

  if (res.error) return alert(res.error.message);

  editingClientId = null;
  clearClientForm();
  loadClients();
}

function clearClientForm() {
  document.querySelectorAll("#clientsTab input").forEach(i => i.value = "");
}

async function loadClients() {
  const { data } = await sb.from("clients").select("*").order("created_at", { ascending: false });

  const tbody = document.querySelector("#clientsTab tbody");
  tbody.innerHTML = data.map(c => `
    <tr>
      <td>${c.full_name}</td>
      <td>${c.ic_passport || ""}</td>
      <td class="edit" onclick='editClient(${JSON.stringify(c)})'>Edit</td>
    </tr>
  `).join("");

  const clientSelect = document.querySelector("#appointmentsTab select");
  clientSelect.innerHTML = data.map(c =>
    `<option value="${c.id}">${c.full_name}</option>`
  ).join("");
}

function editClient(c) {
  editingClientId = c.id;

  const inputs = document.querySelectorAll("#clientsTab input");
  inputs[0].value = c.full_name;
  inputs[1].value = c.date_of_birth || "";
  inputs[2].value = c.ic_passport || "";
  inputs[3].value = c.contact || "";
  inputs[4].value = c.email || "";
  inputs[5].value = c.address || "";
}

/* ================= PRACTITIONERS ================= */
async function addPractitioner() {
  const input = document.querySelector("#practitionersTab input");
  if (!input.value) return;

  await sb.from("practitioners").insert({ name: input.value });
  input.value = "";
  loadPractitioners();
}

async function loadPractitioners() {
  const { data } = await sb.from("practitioners").select("*");

  document.querySelector("#practitionersTab div:last-child").innerHTML =
    data.map(p => `<div>${p.name}</div>`).join("");

  const pracSelect = document.querySelectorAll("#appointmentsTab select")[1];
  pracSelect.innerHTML = data.map(p =>
    `<option value="${p.id}">${p.name}</option>`
  ).join("");
}

/* ================= SERVICES ================= */
async function loadServices() {
  const { data } = await sb.from("services").select("*");

  const serviceSelect = document.querySelectorAll("#appointmentsTab select")[2];
  serviceSelect.innerHTML = data.map(s =>
    `<option value="${s.id}">${s.name} (RM ${s.price})</option>`
  ).join("");
}

/* ================= APPOINTMENTS ================= */
async function saveAppointment() {
  const inputs = document.querySelectorAll("#appointmentsTab input");
  const selects = document.querySelectorAll("#appointmentsTab select");

  const payload = {
    start_time: `${inputs[0].value}T${inputs[1].value}`,
    client_id: selects[0].value,
    practitioner_id: selects[1].value,
    service_id: selects[2].value
  };

  const res = editingAppointmentId
    ? await sb.from("appointments").update(payload).eq("id", editingAppointmentId)
    : await sb.from("appointments").insert(payload);

  if (res.error) return alert(res.error.message);

  editingAppointmentId = null;
  loadAppointments();
}

async function loadAppointments() {
  const { data } = await sb
    .from("appointments")
    .select("*, clients(full_name), services(name,price)")
    .order("start_time", { ascending: false });

  const tbody = document.querySelector("#appointmentsTab tbody");
  tbody.innerHTML = data.map(a => `
    <tr>
      <td>${new Date(a.start_time).toLocaleString()}</td>
      <td>${a.clients.full_name}</td>
      <td>${a.services.name}</td>
      <td>${a.services.price}</td>
      <td class="edit" onclick='editAppointment(${JSON.stringify(a)})'>Edit</td>
    </tr>
  `).join("");
}

function editAppointment(a) {
  editingAppointmentId = a.id;

  const d = new Date(a.start_time);
  const inputs = document.querySelectorAll("#appointmentsTab input");
  const selects = document.querySelectorAll("#appointmentsTab select");

  inputs[0].value = d.toISOString().slice(0,10);
  inputs[1].value = d.toTimeString().slice(0,5);
  selects[0].value = a.client_id;
  selects[1].value = a.practitioner_id;
  selects[2].value = a.service_id;

  tab("appointmentsTab");
}

/* ================= REPORT ================= */
async function loadReport() {
  const { data } = await sb
    .from("appointments")
    .select("start_time, services(name,price)");

  let total = 0;
  const tbody = document.querySelector("#reportsTab tbody");

  tbody.innerHTML = data.map(r => {
    total += Number(r.services.price);
    return `
      <tr>
        <td>${new Date(r.start_time).toLocaleDateString()}</td>
        <td>${r.services.name}</td>
        <td>${r.services.price}</td>
      </tr>
    `;
  }).join("");

  document.querySelector(".total").innerHTML =
    `Total: RM ${total.toFixed(2)}`;
}

/* ================= LOAD ALL ================= */
async function loadAll() {
  await loadClients();
  await loadPractitioners();
  await loadServices();
  await loadAppointments();

  const now = new Date();
  const inputs = document.querySelectorAll("#appointmentsTab input");
  inputs[0].value = now.toISOString().slice(0,10);
  inputs[1].value = now.toTimeString().slice(0,5);
}
</script>

    
</body>
</html>
