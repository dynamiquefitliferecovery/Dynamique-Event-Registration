<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Registration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Segoe UI;
  background: linear-gradient(135deg,#ff9800,#ffd180);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.box {
  background:white;
  padding:30px;
  width:360px;
  border-radius:18px;
}
input, select {
  width:100%;
  padding:10px;
  margin-bottom:10px;
}
button {
  width:100%;
  padding:12px;
  background:orange;
  border:none;
  font-weight:bold;
}
.msg { margin-top:10px; }
</style>
</head>

<body>

<div class="box">
  <h2>Client Registration</h2>

  <input id="name" placeholder="Full Name">
  <input id="dob" type="date">
  <select id="gender">
    <option value="">Gender</option>
    <option>Male</option>
    <option>Female</option>
  </select>
  <select id="citizenship">
    <option>Malaysian</option>
    <option>Foreigner</option>
  </select>
  <input id="ic" placeholder="IC / Passport">
  <input id="contact" placeholder="Contact">
  <input id="email" placeholder="Email">
  <input id="address" placeholder="Address">

  <button onclick="registerClient()">Register</button>
  <div class="msg" id="msg"></div>
</div>

<script>
console.log("✅ Registration page loaded");

const sb = supabase.createClient(
  "https://fmwdizyexroiezezitly.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo"
);

async function registerClient() {
  console.log("🟢 Register clicked");

  const data = {
    full_name: document.getElementById("name").value,
    date_of_birth: document.getElementById("dob").value,
    gender: document.getElementById("gender").value,
    citizenship: document.getElementById("citizenship").value,
    ic_passport: document.getElementById("ic").value,
    contact: document.getElementById("contact").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value
  };

  const msg = document.getElementById("msg");
  msg.textContent = "";

  const { error } = await sb.from("clients").insert(data);

  if (error) {
    console.error(error);
    msg.style.color = "red";
    msg.textContent = error.message;
    return;
  }

  msg.style.color = "green";
  msg.textContent = "✅ Registration successful";
}
</script>

</body>
</html>
