<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Client Registration</title>

  <!-- ✅ Mobile friendly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: linear-gradient(135deg, #ff9800, #ffd180);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .box {
      background: #fff;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: orange;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }

    .msg {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Client Registration</h2>

<input id="full_name" placeholder="Full Name">

<select id="citizenship">
  <option value="">Citizenship</option>
  <option value="Malaysian">Malaysian</option>
  <option value="Foreigner">Foreigner</option>
</select>

<input id="ic_passport" placeholder="IC / Passport" oninput="autoFillDOB()">

<input
  id="date_of_birth"
  type="text"
  placeholder="Date of Birth"
  onfocus="this.type='date'"
  onblur="if(!this.value) this.type='text'"
>

<select id="gender">
  <option value="">Gender</option>
  <option>Male</option>
  <option>Female</option>
</select>

<input id="contact" placeholder="Contact Number">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address (Optional)">

  <button onclick="registerClient()">Register</button>

  <div class="msg" id="msg"></div>
</div>

<script>
  console.log("✅ Register page loaded");

/* ✅ PREVENT FUTURE DATE SELECTION */
document.getElementById("date_of_birth").max =
  new Date().toISOString().split("T")[0];

/* ✅ AUTO FILL DOB + GENDER FROM IC */
function autoFillDOB() {
  const msgBox = document.getElementById("msg");
  msgBox.textContent = "";

const citizenship = document.getElementById("citizenship").value;
  const icInput = document.getElementById("ic_passport");
  const dobInput = document.getElementById("date_of_birth");
  const genderSelect = document.getElementById("gender");

  let icRaw = icInput.value;
  const ic = icRaw.replace(/\D/g, "");

if (citizenship !== "Malaysian") return;
  if (ic.length < 12) return;

  /* ✅ Extract DOB */
  const yy = ic.substring(0, 2);
  const mm = parseInt(ic.substring(2, 4));
  const dd = parseInt(ic.substring(4, 6));

  const year = 2000 + parseInt(yy);


/* ✅ Validate basic date */
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) {
    msgBox.style.color = "red";
    msgBox.textContent = "Invalid IC: Invalid date detected";
    return;
  }

  const formatted = `${year}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
  const inputDate = new Date(formatted);
  const today = new Date();

  
/* ✅ BLOCK FUTURE DOB */
  if (inputDate > today) {
    msgBox.style.color = "red";
    msgBox.textContent = "Date of Birth cannot be in the future";

    dobInput.value = "";
    genderSelect.value = "";
    return;
  }

  /* ✅ SET DOB */
  dobInput.type = "date";
  dobInput.value = formatted;

/* ✅ LOCK DOB when IC is valid */
  dobInput.setAttribute("readonly", true);

  /* ✅ AUTO GENDER */
  const lastDigit = parseInt(ic.charAt(ic.length - 1));

  if (!isNaN(lastDigit)) {
    genderSelect.value = (lastDigit % 2 === 0) ? "Female" : "Male";
  }
}

  const sb = supabase.createClient(
    "https://fmwdizyexroiezezitly.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo"
  );

  async function registerClient() {
    console.log("🟢 Register clicked");

    const msg = document.getElementById("msg");
    msg.textContent = "";

    const data = {
      full_name: document.getElementById("full_name").value.trim(),
      date_of_birth: document.getElementById("date_of_birth").value,
      gender: document.getElementById("gender").value,
      citizenship: document.getElementById("citizenship").value,
      ic_passport: document.getElementById("ic_passport").value.trim(),
      contact: document.getElementById("contact").value.trim(),
      email: document.getElementById("email").value.trim(),
      address: document.getElementById("address").value.trim()
    };

    // ✅ Mandatory validation (address excluded)
    if (
      !data.full_name ||
      !data.date_of_birth ||
      !data.gender ||
      !data.citizenship ||
      !data.ic_passport ||
      !data.contact ||
      !data.email
    ) {
      msg.style.color = "red";
      msg.textContent = "Please fill in all required fields";
      return;
    }

    
  /* ✅ FINAL DOB CHECK */
  const today = new Date();
  const dobDate = new Date(data.date_of_birth);

  if (dobDate > today) {
    msg.style.color = "red";
    msg.textContent = "Date of Birth cannot be in the future";
    return;
  }

    const { error } = await sb.from("clients").insert(data);

    if (error) {
      console.error(error);
      msg.style.color = "red";
      msg.textContent = error.message;
      return;
    }

    msg.style.color = "green";
    msg.textContent = "✅ Registration successful";

    // ✅ Clear form and reset DOB field type
    document.querySelectorAll("input, select").forEach(el => {
      el.value = "";
      if (el.id === "date_of_birth") el.type = "text";
    });
  }
</script>

</body>
</html>
