<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Segoe UI;
      background: linear-gradient(135deg, #ff9800, #ffd180);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      background: white;
      padding: 30px;
      width: 340px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: orange;
      font-weight: bold;
      cursor: pointer;
    }

    .msg {
      margin-top: 10px;
      color: red;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Register</h2>

  <input id="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password (min 6 chars)" />

  <button onclick="register()">Create Account</button>
  <p class="msg" id="msg"></p>
</div>

<script>
  alert("JS is running");
</script>


</body>
</html>
