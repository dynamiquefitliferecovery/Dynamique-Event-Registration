<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Segoe UI;
      background: linear-gradient(135deg, #ff9800, #ffd180);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      background: white;
      padding: 30px;
      width: 340px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: orange;
      font-weight: bold;
      cursor: pointer;
    }

    .msg {
      margin-top: 10px;
      color: red;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Register</h2>

  <input id="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password (min 6 chars)" />

  <button onclick="register()">Create Account</button>
  <p class="msg" id="msg"></p>
</div>

<script>
  const SUPABASE_URL = "https://fmwdizyexroiezezitly.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtd2RpenlleHJvaWV6ZXppdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzA3MDYsImV4cCI6MjA5MzEwNjcwNn0.buw3emsGXC9tsHCwCPxDUPINMx2DOYJu8Qu9UmlmyMo";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.register = async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  msg.textContent = "";

  const result = await sb.auth.signUp({
    email,
    password
  });

  console.log("FULL SIGNUP RESULT:", result);

  if (result.error) {
    msg.textContent = result.error.message;
    return;
  }

  if (!result.data?.user) {
    msg.textContent = "Signup blocked. Check Auth → Settings → Enable signups.";
    return;
  }

  msg.style.color = "green";
  msg.textContent = "✅ User created successfully";
};
</script>


</body>
</html>
